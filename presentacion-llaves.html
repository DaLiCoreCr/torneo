<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentación de llaves · Torneo interno Hoopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=51">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoopz">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  .kl-grid { display: grid; gap: 14px; margin-top: 22px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .kl { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); min-height: 108px; }
  .kl .sd { font: 400 clamp(40px, 6vw, 72px)/1 'Bebas Neue', sans-serif; color: var(--gold); min-width: 1.6em; }
  .kl .nm { font: 400 clamp(26px, 3.6vw, 46px)/1.05 'Bebas Neue', sans-serif; letter-spacing: .03em; }
  .kl small { display: block; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
  .kl.empty-slot { border-style: dashed; opacity: .7; }
  .kl.empty-slot .nm { color: var(--muted); }
  .kl.filled { animation: pop .55s cubic-bezier(.2, 1.4, .4, 1); border-color: var(--gold); }
  .kl .badge { width: 64px; height: 64px; font-size: 24px; flex: none; }
  .kl-start { margin: 26px 0; display: flex; gap: 12px; flex-wrap: wrap; }
  .kl-start .btn { font-size: 22px; padding: 14px 28px; }
  .vs { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 4vw, 64px); flex-wrap: wrap; margin-top: 22px; }
  .vs .side { text-align: center; max-width: 36vw; }
  .vs .side .badge { width: min(24vw, 170px); height: min(24vw, 170px); font-size: 60px; margin: 0 auto 8px; }
  .vs .side .tm { font-size: clamp(28px, 5vw, 64px); color: #fff; }
  .vs .side small { font-size: clamp(14px, 2vw, 22px); }
  .vs .mid { font: 400 clamp(48px, 9vw, 120px)/1 'Bebas Neue', sans-serif; color: var(--gold); text-shadow: 0 0 24px rgba(201, 168, 76, .7); animation: pop .5s both cubic-bezier(.2, 1.4, .4, 1); }
  .vs .a { animation: slidel .7s both cubic-bezier(.2, 1, .3, 1); }
  .vs .b { animation: slider .7s both cubic-bezier(.2, 1, .3, 1); }
  @keyframes slidel { from { opacity: 0; transform: translateX(-80px) scale(.8); } }
  @keyframes slider { from { opacity: 0; transform: translateX(80px) scale(.8); } }
  .kl-end { margin-top: 26px; }
</style>
</head>
<body>
<main><div class="wrap pres"><div id="app"></div></div></main>
<div class="reveal" id="reveal"></div>
<script src="js/firebase-config.js?v=51"></script>
<script src="js/core.js?v=51"></script>
<script src="js/seed.js?v=51"></script>
<script src="js/ui.js?v=51"></script>
<script>
/* Presentación de llaves: se calcula todo en este navegador con la tabla de posiciones (una sola lectura); no escribe nada. */
T.load({ live: false }).then(() => {
UI.layout('');
document.body.classList.add('tv');
const { esc } = T;
const app = document.getElementById('app');
const reveal = document.getElementById('reveal');
const ids = T.state().config.categories.map(c => c.id);
let cat = new URLSearchParams(location.search).get('cat');
if (!ids.includes(cat)) cat = UI.getCat(false);
let running = false, token = 0, shown = null;
const ROLL_MS = 2300, SEED_MS = 3600, MATCH_MS = 5200;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function burst() {
  const reach = Math.min(innerWidth, innerHeight) * 0.5;
  return Array.from({ length: 36 }, (_, i) => {
    const a = Math.random() * Math.PI * 2, r = 110 + Math.random() * reach;
    return `<i style="--x:${(Math.cos(a) * r * 1.5).toFixed(0)}px;--y:${(Math.sin(a) * r).toFixed(0)}px;--s:${(14 + Math.random() * 34).toFixed(0)}px;--d:${(Math.random() * 0.6).toFixed(2)}s;--r:${(Math.random() * 360).toFixed(0)}deg">${['★', '✦', '✧'][i % 3]}</i>`;
  }).join('');
}
function show(html, cls) {
  reveal.innerHTML = html;
  reveal.classList.remove('show', 'out', 'group'); void reveal.offsetWidth;
  if (cls) reveal.classList.add(cls);
  reveal.classList.add('show');
}
function hide() { reveal.classList.add('out'); return sleep(450).then(() => reveal.classList.remove('show', 'out')); }

/* Clasificados y cruces: si las llaves ya existen se usan sus equipos; si no, la tabla actual (1.º vs 4.º y 2.º vs 3.º) */
function plan(S) {
  const table = T.standings(S, cat);
  const sf = S.games.filter(g => g.cat === cat && g.stage === 'sf').sort((a, b) => a.slot - b.slot);
  const direct = !sf.length && S.games.some(g => g.cat === cat && g.stage === 'final');
  const n = direct ? 2 : 4;
  const rows = table.slice(0, n);
  let pairs;
  if (sf.length) pairs = sf.map(g => ({ title: 'Semifinal ' + g.slot, h: S.teams.find(t => t.id === g.home), a: S.teams.find(t => t.id === g.away), hs: g.seeds ? g.seeds.h : null, as: g.seeds ? g.seeds.a : null, date: g.date }));
  else if (n === 4) pairs = [{ title: 'Semifinal 1', h: rows[0].team, a: rows[3].team, hs: 1, as: 4 }, { title: 'Semifinal 2', h: rows[1].team, a: rows[2].team, hs: 2, as: 3 }];
  else pairs = [{ title: 'Final', h: rows[0].team, a: rows[1].team, hs: 1, as: 2 }];
  const played = T.leagueGames(S, cat).some(g => g.status === 'final') || sf.length > 0 || direct;
  return { table, rows, n, pairs, played, ok: table.length >= n && n >= 2 };
}

function slots(S, p, upto) {
  return `<div class="kl-grid">${Array.from({ length: p.n }, (_, i) => {
    const r = p.rows[i], on = r && (p.n - i) >= upto; // se llenan de abajo hacia arriba: 4.º, 3.º, 2.º, 1.º
    return on ? `<div class="kl filled">${UI.badge(r.team)}<div><div class="nm"><span class="sd">${i + 1}.º</span> ${esc(r.team.name)}</div><small>${r.pts} pts · ${r.pj} PJ · dif ${r.dif > 0 ? '+' : ''}${r.dif}</small></div></div>`
      : `<div class="kl empty-slot"><div class="nm"><span class="sd">${i + 1}.º</span> ?</div></div>`;
  }).join('')}</div>`;
}

function render() {
  const S = T.state(), p = plan(S);
  const catName = UI.catName(S, cat);
  const head = `<div class="pres-h"><h1>Llaves del torneo<br><b>${esc(catName)}</b></h1>
    <div class="row">${S.config.categories.length > 1 ? `<div class="pills" style="margin:0">${S.config.categories.map(c => `<button class="pill ${c.id === cat ? 'on' : ''}" data-cat="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div>` : ''}
      <a class="btn sm ghost" href="llaves.html">← Llaves</a><button class="btn sm ghost" id="fs">${document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa'}</button></div></div>`;
  if (!p.ok) { app.innerHTML = head + `<div class="empty" style="margin-top:20px">Se necesitan al menos ${p.n} equipos en esta categoría para armar llaves.</div>`; return; }
  if (!p.played) { app.innerHTML = head + `<div class="empty" style="margin-top:20px">Todavía no hay puntos: las llaves se arman con la tabla de posiciones y se podrán presentar cuando se jueguen los partidos de la fase regular.</div>`; return; }
  app.innerHTML = head + `<div class="kl-start"><button class="btn gold" id="go">${shown === cat ? '↺ Repetir presentación' : '▶ Iniciar presentación'}</button></div>
    <p class="note">Las llaves se arman con la tabla de posiciones: ${p.n === 4 ? '1.º vs 4.º y 2.º vs 3.º' : '1.º vs 2.º'}. Esta pantalla solo las presenta con suspenso, sin sorteo y sin escribir nada.</p>
    <div id="stage">${shown === cat ? UI.bracketView(S, cat) : slots(S, p, 99)}</div>`;
  UI.fitTV();
}

async function run() {
  if (running) return;
  const S = T.reload() || T.state(), p = plan(S);
  if (!p.ok || !p.played) return;
  running = true; const my = ++token;
  const names = S.teams.filter(t => t.cat === cat).map(t => t.name);
  document.getElementById('go').disabled = true;
  const stage = document.getElementById('stage');
  stage.innerHTML = slots(S, p, 99);
  await sleep(500);
  /* 1) Clasificados: del último al primero, con suspenso */
  for (let i = p.n - 1; i >= 0 && my === token; i--) {
    show(`<div class="rv"><small>Clasificado · puesto ${i + 1}.º</small><div class="who" id="rn">· · ·</div></div>`);
    const iv = setInterval(() => { const el = document.getElementById('rn'); if (el) el.textContent = names[Math.floor(Math.random() * names.length)]; }, 80);
    await sleep(ROLL_MS); clearInterval(iv);
    const r = p.rows[i];
    show(`<div class="rv"><div class="burst">${burst()}</div>${UI.badge(r.team)}<small>${i === 0 ? '★ Líder de la tabla' : 'Puesto ' + (i + 1) + '.º'}</small><div class="who">${esc(r.team.name)}</div><div class="tm">${r.pts} puntos</div></div>`);
    await sleep(SEED_MS);
    await hide();
    stage.innerHTML = slots(S, p, p.n - i);
    await sleep(400);
  }
  /* 2) Cruces */
  for (const m of p.pairs) {
    if (my !== token) break;
    show(`<div class="rv"><small>${esc(m.title)}</small><div class="vs">
      <div class="side a">${UI.badge(m.h)}<small>${m.hs ? m.hs + '.º lugar' : ''}</small><div class="tm">${esc(m.h.name)}</div></div>
      <div class="mid" style="animation-delay:.9s">VS</div>
      <div class="side b" style="animation-delay:1.5s">${UI.badge(m.a)}<small>${m.as ? m.as + '.º lugar' : ''}</small><div class="tm">${esc(m.a.name)}</div></div></div>
      ${m.date ? `<small style="margin-top:18px">${UI.fmtDate(m.date)} · ${UI.fmtTime(m.date)}</small>` : ''}</div>`);
    await sleep(MATCH_MS);
    await hide();
  }
  if (my === token) { shown = cat; stage.innerHTML = UI.bracketView(T.state(), cat); document.getElementById('go').textContent = '↺ Repetir presentación'; }
  document.getElementById('go').disabled = false;
  running = false;
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-cat]');
  if (b && !running) { cat = b.dataset.cat; shown = null; history.replaceState(null, '', '?cat=' + cat); render(); }
  if (e.target.id === 'go') run();
  if (e.target.id === 'fs') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
});
document.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !running && document.getElementById('go') && e.target.tagName !== 'BUTTON') { e.preventDefault(); run(); } });
document.addEventListener('fullscreenchange', () => { if (!running) render(); });
reveal.addEventListener('click', () => { /* la presentación sigue sola; un toque no la corta */ });
render();
});
</script>
</body>
</html>
