<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estadísticas · Torneo Hoopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main><div class="wrap page">
  <h1 class="page-title">Estadísticas del <b>torneo</b></h1>
  <div class="pills" id="cats"></div>
  <div style="margin:10px 0"><span class="seg" id="mode"><button data-m="avg" class="on">Promedio</button><button data-m="tot">Total</button></span></div>
  <div id="app"></div>
</div></main>
<script src="js/core.js"></script>
<script src="js/seed.js"></script>
<script src="js/ui.js"></script>
<script>
T.load();
UI.layout('est');
const { esc } = T;
let cat = UI.catPicker(document.getElementById('cats'), { all: false }, c => { cat = c; render(); });
let mode = 'avg', sortKey = 'pts';
const app = document.getElementById('app');

const LEADERS = [['pts', 'Puntos'], ['p3m', 'Triples'], ['reb', 'Rebotes'], ['ast', 'Asistencias'], ['stl', 'Robos'], ['blk', 'Tapones']];
const COLS = [['pts', 'PTS'], ['p1', 'TL'], ['p2', '2P'], ['p3', '3P'], ['reb', 'REB'], ['ast', 'AST'], ['stl', 'ROB'], ['blk', 'TAP'], ['to', 'PER'], ['pf', 'FAL']];

const val = (r, k) => (mode === 'avg' ? r[k] / r.gp : r[k]);
const fmt = v => (mode === 'avg' ? v.toFixed(1) : String(v));
const made = (r, k) => (k === 'p1' || k === 'p2' || k === 'p3' ? r[k + 'm'] : r[k]);
const att = (r, k) => r[k + 'a'];

document.getElementById('mode').addEventListener('click', e => {
  const b = e.target.closest('[data-m]'); if (!b) return;
  mode = b.dataset.m;
  document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
app.addEventListener('click', e => {
  const th = e.target.closest('[data-k]'); if (!th) return;
  sortKey = th.dataset.k; render();
});

function render() {
  const S = T.state();
  const rows = T.tournamentStats(S, cat);
  if (!rows.length) { app.innerHTML = '<div class="empty">Aún no hay estadísticas.</div>'; return; }
  const leaders = LEADERS.map(([k, label]) => {
    const top = rows.slice().sort((a, b) => val(b, k) - val(a, k)).slice(0, 5);
    return `<div class="lead"><h3>${label}</h3><ol>${top.map((r, i) => `<li><span class="n">${i + 1}</span>${UI.badge(r.team)}
      <span class="who">${esc(r.player.name)}<small>#${r.player.num} · ${esc(r.team.name)} · ${r.gp} PJ</small></span><b>${fmt(val(r, k))}</b></li>`).join('')}</ol></div>`;
  }).join('');
  const sortVal = r => (sortKey === 'p1' || sortKey === 'p2' || sortKey === 'p3' ? val({ ...r, [sortKey]: r[sortKey + 'm'] }, sortKey) : val(r, sortKey));
  const sorted = rows.slice().sort((a, b) => sortVal(b) - sortVal(a));
  const head = COLS.map(([k, l]) => `<th class="sort ${k === sortKey ? 'cur' : ''}" data-k="${k}">${l}</th>`).join('');
  const body = sorted.map(r => `<tr><td class="tm">${UI.badge(r.team)}<span>#${r.player.num} ${esc(r.player.name)}<small class="muted" style="display:block;font-weight:400">${esc(r.team.name)}</small></span></td><td>${r.gp}</td>
    ${COLS.map(([k]) => {
      if (k === 'p1' || k === 'p2' || k === 'p3') return `<td>${mode === 'avg' ? (r[k + 'm'] / r.gp).toFixed(1) : r[k + 'm'] + '/' + r[k + 'a']}</td>`;
      return `<td class="${k === 'pts' ? 'hl' : ''}">${fmt(val(r, k))}</td>`;
    }).join('')}</tr>`).join('');
  app.innerHTML = `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:8px">${leaders}</div>
    <div class="sec"><div class="sec-h"><h2>Todos los <b>jugadores</b></h2></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="l">Jugador</th><th>PJ</th>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="note">${mode === 'avg' ? 'Promedios por partido.' : 'Totales; TL, 2P y 3P como anotados/intentados.'} Toca una columna para ordenar. PJ = partidos jugados, TL = tiros libres, ROB = robos, TAP = tapones, PER = pérdidas, FAL = faltas.</p></div>`;
}
render();
UI.autoRefresh(render);
</script>
</body>
</html>
