<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentación del sorteo · Torneo interno Hoopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=56">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoopz">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<main><div class="wrap pres"><div id="app"></div></div></main>
<div class="reveal" id="reveal"></div>
<script src="js/firebase-config.js?v=56"></script>
<script src="js/core.js?v=56"></script>
<script src="js/seed.js?v=56"></script>
<script src="js/ui.js?v=56"></script>
<script>
T.load().then(() => {
UI.layout('');
document.body.classList.add('tv');
const { esc } = T;
const app = document.getElementById('app');
const reveal = document.getElementById('reveal');
const ids = T.state().config.categories.map(c => c.id);
let cat = new URLSearchParams(location.search).get('cat');
if (!ids.includes(cat)) cat = UI.getCat(false);
const seen = {};
let hideT = null, fadeT = null;
const REVEAL_MS = 3500; // cuánto tiempo se muestra un jugador elegido
const ROLL_MS = 2600;  // suspenso: nombres que giran antes de revelar (solo animación local, no consume red)
const GROUP_MS = 5000;  // cuánto tiempo se muestra un equipo completo sorteado

function burst() {
  const reach = Math.min(innerWidth, innerHeight) * 0.5;
  return Array.from({ length: 44 }, (_, i) => {
    const a = Math.random() * Math.PI * 2, r = 110 + Math.random() * reach;
    return `<i style="--x:${(Math.cos(a) * r * 1.5).toFixed(0)}px;--y:${(Math.sin(a) * r).toFixed(0)}px;--s:${(14 + Math.random() * 34).toFixed(0)}px;--d:${(Math.random() * 0.6).toFixed(2)}s;--r:${(Math.random() * 360).toFixed(0)}deg">${['★', '✦', '✧'][i % 3]}</i>`;
  }).join('');
}

function present(html, ms, cls) {
  reveal.innerHTML = html;
  reveal.classList.remove('show', 'out', 'group'); void reveal.offsetWidth; // reinicia la animación si llegan dos seguidas
  if (cls) reveal.classList.add(cls);
  reveal.classList.add('show');
  clearTimeout(hideT); clearTimeout(fadeT);
  fadeT = setTimeout(() => reveal.classList.add('out'), ms - 450);
  hideT = setTimeout(() => reveal.classList.remove('show', 'out'), ms);
}

/* Equipo completo: todos los nombres juntos con el mismo efecto */
function showGroup(S, g) {
  const t = S.teams.find(x => x.id === g.teamId);
  if (!t) return;
  const names = g.roster.slice().sort((a, b) => (b.cap ? 1 : 0) - (a.cap ? 1 : 0));
  const cols = names.length > 12 ? 3 : names.length > 5 ? 2 : 1;
  present(`<div class="rv"><div class="burst">${burst()}</div>${UI.badge(t)}<small>${g.kind === 'cap' ? 'Capitanes del equipo' : g.kind === 'parent' ? 'Coaches del equipo' : 'Equipo formado'}</small><div class="tm">${esc(t.name)}</div>
    <div class="names" style="--cols:${cols}">${names.map((p, i) => `<span style="--i:${i}">${p.cap ? '★ ' : ''}${esc(p.name)}</span>`).join('')}</div></div>`, GROUP_MS, 'group');
}

function showReveal(S, last) {
  const t = S.teams.find(x => x.id === last.teamId);
  if (!t) return;
  present(`<div class="rv"><div class="burst">${burst()}</div>${UI.badge(t)}<small>${last.cap ? '★ Capitán · ' : ''}se une a</small>
    <div class="who">${esc(last.name)}</div><div class="tm">${esc(t.name)}</div></div>`, REVEAL_MS);
}
/* Suspenso: gira nombres al azar un momento y luego revela el resultado */
/* Los nombres sorteados no se ven en los equipos hasta que termina la revelación */
const held = new Set(), freshSet = new Set(), heldNames = new Set();
function holdUntil(pids, ms, names) {
  pids.forEach(x => held.add(x));
  (names || []).forEach(x => heldNames.add(x));
  setTimeout(() => {
    pids.forEach(x => { held.delete(x); freshSet.add(x); });
    (names || []).forEach(x => heldNames.delete(x));
    render();
    setTimeout(() => { pids.forEach(x => freshSet.delete(x)); render(); }, 4000);
  }, ms);
}
let rollTok = 0;
function roll(names, then) {
  const tok = ++rollTok;
  present('<div class="rv"><small>Sorteando…</small><div class="who" id="rollname">· · ·</div></div>', ROLL_MS + 600);
  const iv = setInterval(() => { const el = document.getElementById('rollname'); if (el && names.length) el.textContent = names[Math.floor(Math.random() * names.length)]; }, 80);
  setTimeout(() => { clearInterval(iv); if (tok === rollTok) then(); }, ROLL_MS);
}
reveal.addEventListener('click', () => reveal.classList.remove('show'));

function render() {
  const S = T.state();
  const teams = S.teams.filter(t => t.cat === cat);
  const d = T.draft(S, cat);
  const placed = teams.reduce((n, t) => n + t.players.filter(p => !held.has(p.id)).length, 0);
  const catName = UI.catName(S, cat);

  const g = d.group;
  const evTs = Math.max(d.last ? d.last.ts : 0, g ? g.ts : 0);
  if (!(cat in seen)) seen[cat] = evTs;
  else if (evTs > seen[cat]) {
    seen[cat] = evTs;
    const pool = d.pool.map(p => p.name);
    if (g && g.ts === evTs) { holdUntil(g.pids, ROLL_MS + GROUP_MS, g.coachNames); roll(g.pick === 'team' ? teams.map(t => t.name) : pool.concat(g.roster.map(p => p.name)), () => showGroup(S, g)); }
    else if (d.last) { holdUntil([d.last.pid], ROLL_MS + REVEAL_MS); roll(pool.concat(d.last.name), () => showReveal(S, d.last)); }
  }
  const fresh = freshSet;
  const heldPlayers = teams.flatMap(t => t.players.filter(p => held.has(p.id)));

  app.innerHTML = `
    <div class="pres-h"><h1>Sorteo de equipos<br><b>${esc(catName)}</b></h1>
      <div class="row"><div class="cnt">${d.pool.some(p => p.captain) ? 'Fase 1 · Capitanes' : d.pool.length ? 'Fase 2 · Jugadores' : placed ? 'Sorteo completo' : ''} · Asignados <b>${placed}</b> · Por elegir <b>${d.pool.length + heldPlayers.length}</b></div>
        ${S.config.categories.length > 1 ? `<div class="pills" style="margin:0">${S.config.categories.map(c => `<button class="pill ${c.id === cat ? 'on' : ''}" data-cat="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div>` : ''}
        <a class="btn sm ghost" href="index.html">← Inicio</a><button class="btn sm ghost" id="fs">${document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa'}</button></div></div>
    ${teams.length ? `<div class="pt-grid" style="--tc:${teams.length <= 3 ? teams.length : teams.length === 4 ? 4 : teams.length <= 6 ? 3 : 5}">${teams.map(t => {
      const ps = t.players.filter(p => !held.has(p.id)).sort((a, b) => (b.captain ? 1 : 0) - (a.captain ? 1 : 0));
      const cl = T.coachList(t).filter(c => !heldNames.has(c));
      return `<div class="pt"><div class="pt-h">${UI.badge(t)}<div><h2>${esc(t.name)}</h2><small>${cl.length ? (cl.length > 1 ? 'Coaches ' : 'Coach ') + esc(cl.map(c => c.replace(/^coach\s+/i, '')).join(', ')) + ' · ' : ''}${ps.length} jugador${ps.length === 1 ? '' : 'es'}</small></div></div>
        <ul>${ps.map(p => `<li class="${p.captain ? 'capi' : ''} ${fresh.has(p.id) ? 'fresh' : ''}">${esc(p.name)}${UI.capMark(p)}</li>`).join('') || '<li class="muted">—</li>'}</ul></div>`;
    }).join('')}</div>` : '<div class="empty" style="margin-top:20px">Aún no hay equipos en esta categoría.</div>'}
    ${d.pool.length + heldPlayers.length ? `<div class="pool-strip">${d.pool.concat(heldPlayers).map(p => `<span>${esc(p.name)}</span>`).join('')}</div>` : ''}`;
  UI.fitTV();
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-cat]');
  if (b) { cat = b.dataset.cat; history.replaceState(null, '', '?cat=' + cat); render(); }
  if (e.target.id === 'fs') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
});

document.addEventListener('fullscreenchange', () => render());
render();
T.subscribe(render);
});
</script>
</body>
</html>
