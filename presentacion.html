<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentación del sorteo · Torneo Hoopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=7">
</head>
<body>
<main><div class="wrap pres"><div id="app"></div></div></main>
<div class="reveal" id="reveal"></div>
<script src="js/firebase-config.js?v=7"></script>
<script src="js/core.js?v=7"></script>
<script src="js/seed.js?v=7"></script>
<script src="js/ui.js?v=7"></script>
<script>
T.load().then(() => {
UI.layout('');
document.body.classList.add('tv');
const { esc } = T;
const app = document.getElementById('app');
const reveal = document.getElementById('reveal');
const ids = T.state().config.categories.map(c => c.id);
let cat = new URLSearchParams(location.search).get('cat');
if (!ids.includes(cat)) cat = UI.getCat(false);
const seen = {};
let hideT = null;

function showReveal(S, last) {
  const t = S.teams.find(x => x.id === last.teamId);
  if (!t) return;
  const reach = Math.min(innerWidth, innerHeight) * 0.5;
  const stars = Array.from({ length: 44 }, (_, i) => {
    const a = Math.random() * Math.PI * 2, r = 110 + Math.random() * reach;
    return `<i style="--x:${(Math.cos(a) * r * 1.5).toFixed(0)}px;--y:${(Math.sin(a) * r).toFixed(0)}px;--s:${(14 + Math.random() * 34).toFixed(0)}px;--d:${(Math.random() * 1.3).toFixed(2)}s;--r:${(Math.random() * 360).toFixed(0)}deg">${['★', '✦', '✧'][i % 3]}</i>`;
  }).join('');
  reveal.innerHTML = `<div class="rv"><div class="burst">${stars}</div>${UI.badge(t)}<small>${last.cap ? '★ Capitán · ' : ''}se une a</small>
    <div class="who">${esc(last.name)}</div><div class="tm">${esc(t.name)}</div></div>`;
  reveal.classList.remove('show'); void reveal.offsetWidth; // reinicia la animación si llegan dos seguidas
  reveal.classList.add('show');
  clearTimeout(hideT);
  hideT = setTimeout(() => reveal.classList.remove('show'), 6500);
}
reveal.addEventListener('click', () => reveal.classList.remove('show'));

function render() {
  const S = T.state();
  const teams = S.teams.filter(t => t.cat === cat);
  const d = T.draft(S, cat);
  const placed = teams.reduce((n, t) => n + t.players.length, 0);
  const catName = UI.catName(S, cat);

  if (!(cat in seen)) seen[cat] = d.last ? d.last.ts : 0;
  else if (d.last && d.last.ts > seen[cat]) { seen[cat] = d.last.ts; showReveal(S, d.last); }
  const freshPid = d.last && Date.now() - d.last.ts < 6000 ? d.last.pid : null;

  const spotP = d.spot && d.pool.find(p => p.id === d.spot.pid);
  app.innerHTML = `
    <div class="pres-h"><h1>Sorteo de equipos<br><b>${esc(catName)}</b></h1>
      <div class="row"><div class="cnt">Asignados <b>${placed}</b> · Por elegir <b>${d.pool.length}</b></div>
        ${S.config.categories.length > 1 ? `<div class="pills" style="margin:0">${S.config.categories.map(c => `<button class="pill ${c.id === cat ? 'on' : ''}" data-cat="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div>` : ''}
        <button class="btn sm ghost" id="fs">Pantalla completa</button></div></div>
    ${spotP ? `<div class="spot"><small>Turno de elegir</small><b>${esc(spotP.name)}${spotP.captain ? ' (C)' : ''}</b></div>` : ''}
    ${teams.length ? `<div class="pt-grid">${teams.map(t => {
      const ps = t.players.slice().sort((a, b) => (b.captain ? 1 : 0) - (a.captain ? 1 : 0));
      return `<div class="pt"><div class="pt-h">${UI.badge(t)}<div><h2>${esc(t.name)}</h2><small>${t.coach ? 'Coach ' + esc(t.coach.replace(/^coach\s+/i, '')) + ' · ' : ''}${t.players.length} jugador${t.players.length === 1 ? '' : 'es'}</small></div></div>
        <ul>${ps.map(p => `<li class="${p.captain ? 'capi' : ''} ${p.id === freshPid ? 'fresh' : ''}">${esc(p.name)}${UI.capMark(p)}</li>`).join('') || '<li class="muted">—</li>'}</ul></div>`;
    }).join('')}</div>` : '<div class="empty" style="margin-top:20px">Aún no hay equipos en esta categoría.</div>'}
    ${d.pool.length ? `<div class="pool-strip">${d.pool.map(p => `<span>${esc(p.name)}</span>`).join('')}</div>` : ''}`;
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-cat]');
  if (b) { cat = b.dataset.cat; history.replaceState(null, '', '?cat=' + cat); render(); }
  if (e.target.id === 'fs') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
});

render();
T.subscribe(render);
});
</script>
</body>
</html>
