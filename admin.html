<script>
T.load().then(() => {
UI.layout('');
const { esc } = T;
const app = document.getElementById('app');
let tab = 'teams', cat = UI.getCat(false), openTeam = null;

const TABS = [['teams', 'Equipos'], ['pool', 'Jugadores y sorteo'], ['games', 'Partidos'], ['draw', 'Sorteo de partidos'], ['rules', 'Reglas'], ['monitor', 'Monitoreo'], ['data', 'Datos']];
const field = (label, html) => `<div><label class="lbl">${label}</label>${html}</div>`;
const val = id => document.getElementById(id).value.trim();
function confirmDanger(msg) {
  const aviso = T.cloud ? 'ATENCIÓN: son los datos reales y los ve todo el público.\n' : '';
  const r = prompt(aviso + msg + '\n\nEscribe REINICIAR para confirmar:');
  if (r === null) return false;
  if (r.trim().toUpperCase() !== 'REINICIAR') { UI.toast('No se confirmó: debes escribir REINICIAR', 'bad'); return false; }
  return true;
}
const nowLocal = () => { const d = new Date(Date.now() + 3600e3); d.setMinutes(0, 0, 0); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:00`; };

function start() { render(); }

function catBar(S) {
  return `<div class="pills">${S.config.categories.map(c => `<button class="pill ${c.id === cat ? 'on' : ''}" data-act="cat" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div>`;
}

function teamsView(S) {
  const teams = S.teams.filter(t => t.cat === cat);
  return `${catBar(S)}
    <div class="card" style="margin:12px 0"><div class="frm">
      ${field('Nuevo equipo', '<input class="inp" id="nt-name" placeholder="Nombre del equipo">')}
      ${field('Coach', '<input class="inp" id="nt-coach" placeholder="Nombre del coach">')}
      <button class="btn gold" data-act="addteam">Crear equipo</button></div></div>
    <div class="cols">${teams.map(t => {
      const open = openTeam === t.id;
      return `<div class="team-card"><div class="team-h" data-act="toggle" data-id="${esc(t.id)}">${UI.badge(t)}<div class="grow"><b>${esc(t.name)}</b><small>${esc(T.coachList(t).join(', ') || 'Sin coach')} ·${t.players.length} jugadores</small></div><span class="muted">${open ? '▲' : '▼'}</span></div>
      ${open ? `<div class="team-b">
        <div class="frm">${field('Nombre', `<input class="inp" data-f="name" data-id="${esc(t.id)}" value="${esc(t.name)}">`)}
          ${field('Color', `<input class="inp" type="color" data-f="color" data-id="${esc(t.id)}" value="${esc(t.color || '#c9a84c')}" style="height:42px;padding:4px">`)}
          ${field('Logo', `<div class="row">${t.logo ? UI.badge(t) : ''}<label class="btn sm ghost" style="cursor:pointer">${t.logo ? 'Cambiar' : 'Subir'}<input type="file" accept="image/*" data-logo="${esc(t.id)}" hidden></label>${t.logo ? `<button class="btn sm danger" data-act="dellogo" data-id="${esc(t.id)}">Quitar</button>` : ''}</div>`)}
          <button class="btn danger" data-act="delteam" data-id="${esc(t.id)}">Eliminar equipo</button></div>
        <div style="margin:18px 0 22px;padding:14px;border:1px solid var(--line);border-radius:var(--r)"><label class="lbl">Coaches (${T.coachList(t).length})</label>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px">${T.coachList(t).map((c, i) => `<span class="chip soft" style="display:inline-flex;gap:10px;align-items:center;font-size:15px;padding:6px 10px">${esc(c)} <a href="#" data-act="delcoach" data-id="${esc(t.id)}" data-i="${i}" title="Quitar" style="color:inherit">✕</a></span>`).join('') || '<span class="muted" style="font-size:14px">Sin coaches todavía. Agrégalos aquí o con el botón "→ Coach" de un jugador.</span>'}</div>
          <div class="row"><input class="inp" id="nc-name-${esc(t.id)}" placeholder="Nombre del coach (papá, mamá o jugador mayor)" style="flex:1;min-width:200px"><button class="btn gold" data-act="addcoach" data-id="${esc(t.id)}">Agregar coach</button></div></div>
        <div><label class="lbl">Jugadores (${t.players.length})</label>
        ${t.players.map(p => `<div class="pl-row" style="margin-bottom:6px"><input class="inp" type="number" data-pf="num" data-id="${esc(t.id)}" data-p="${esc(p.id)}" value="${p.num}"><input class="inp" data-pf="name" data-id="${esc(t.id)}" data-p="${esc(p.id)}" value="${esc(p.name)}">
          <select class="inp" data-pf="gender" data-id="${esc(t.id)}" data-p="${esc(p.id)}"><option value="" ${!p.gender ? 'selected' : ''}>—</option><option value="F" ${p.gender === 'F' ? 'selected' : ''}>F</option><option value="M" ${p.gender === 'M' ? 'selected' : ''}>M</option></select>
          <label class="chk" title="Capitán"><input type="checkbox" data-pf="captain" data-id="${esc(t.id)}" data-p="${esc(p.id)}" ${p.captain ? 'checked' : ''}>C</label>
          <button class="btn sm ghost" data-act="p2coach" data-id="${esc(t.id)}" data-p="${esc(p.id)}" title="Agregar a este jugador como coach del equipo">${T.coachList(t).includes(p.name) ? '✓ Coach' : '→ Coach'}</button>
          <button class="btn danger sm" data-act="delpl" data-id="${esc(t.id)}" data-p="${esc(p.id)}">✕</button></div>`).join('')}
        <div class="pl-row" style="margin-top:10px;grid-template-columns:70px 1fr 90px auto"><input class="inp" type="number" id="np-num" placeholder="#"><input class="inp" id="np-name" placeholder="Nombre del jugador">
          <select class="inp" id="np-g"><option value="F">F</option><option value="M">M</option></select><button class="btn gold sm" data-act="addpl" data-id="${esc(t.id)}">Agregar</button></div></div>
      </div>` : ''}</div>`;
    }).join('') || '<div class="empty">No hay equipos en esta categoría.</div>'}</div>`;
}

/* Jugadores posiblemente repetidos entre categorías (mismo nombre y primer apellido). Cada entrada: dónde está (lista sin equipo o equipo). */
const keyOf = n => n.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').split(/\s+/).slice(0, 2).join(' ');
function findDupes(S) {
  const by = {};
  S.config.categories.forEach(c => {
    T.draft(S, c.id).pool.forEach(p => { (by[keyOf(p.name)] = by[keyOf(p.name)] || []).push({ cat: c.id, id: p.id, name: p.name, where: 'sin equipo' }); });
    S.teams.filter(t => t.cat === c.id).forEach(t => t.players.forEach(p => { (by[keyOf(p.name)] = by[keyOf(p.name)] || []).push({ cat: c.id, id: p.id, name: p.name, where: t.name }); }));
  });
  return Object.entries(by).filter(([k, l]) => new Set(l.map(x => x.cat)).size > 1);
}
function removeEntry(s, e) {
  const d = T.draftW(s, e.cat);
  d.pool = d.pool.filter(p => p.id !== e.id);
  s.teams.filter(t => t.cat === e.cat).forEach(t => { t.players = t.players.filter(p => p.id !== e.id); });
}
function dupView(S) {
  const dupes = findDupes(S);
  if (!dupes.length) return '';
  return `<div class="card" style="margin:12px 0;border-color:var(--live)"><h3 style="font-size:20px;color:var(--live)">⚠ Posibles jugadores repetidos entre categorías (${dupes.length})</h3>
    <p class="muted" style="font-size:13px">Un jugador solo debería estar en una categoría. Elige dónde se queda, o quítalo del torneo.</p>
    ${dupes.map(([k, l]) => `<div style="padding:10px 0;border-top:1px solid var(--line)">
      <div style="margin-bottom:6px">${l.map(x => `<b>${esc(x.name)}</b> <span class="muted">(${esc(UI.catName(S, x.cat))} · ${esc(x.where)})</span>`).join(' &nbsp;·&nbsp; ')}</div>
      <div class="row">${[...new Set(l.map(x => x.cat))].map(c => `<button class="btn sm gold" data-act="dupkeep" data-k="${esc(k)}" data-c="${esc(c)}">Dejar solo en ${esc(UI.catName(S, c))}</button>`).join('')}
        <button class="btn sm danger" data-act="dupall" data-k="${esc(k)}">Quitar de todo el torneo</button></div></div>`).join('')}</div>`;
}

function poolView(S) {
  const d = T.draft(S, cat);
  const inTeams = S.teams.filter(t => t.cat === cat).reduce((n, t) => n + t.players.length, 0);
  return `${catBar(S)}
    ${dupView(S)}
    <div class="card" style="margin:12px 0">
      <label class="lbl">Pega la lista de jugadores: uno por línea, "Nombre Apellido, F o M" (el género es opcional)</label>
      <textarea class="inp" id="pool-text" rows="6" placeholder="Valeria Rojas, F&#10;Mateo Mora, M"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn gold" data-act="addpool">Agregar a la lista</button>
        <label class="btn ghost" style="cursor:pointer">Cargar archivo CSV o TXT<input type="file" id="pool-file" accept=".csv,.txt,text/plain" hidden></label>
        <a class="btn" href="sorteo.html">Ir al sorteo →</a></div>
      <p class="note"><b>${d.pool.length}</b> sin equipo · <b>${inTeams}</b> ya en equipos. Si un nombre ya existe se omite. Puedes marcar capitanes aquí o durante el sorteo.</p></div>
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 class="gold" style="font-size:22px">Jugadores sin equipo</h3>
      ${d.pool.length ? '<button class="btn sm danger" data-act="clearpool">Vaciar lista</button>' : ''}</div>
    <div class="cols">${d.pool.map(p => `<div class="pl-row" style="grid-template-columns:1fr 90px 52px auto auto">
      <input class="inp" data-pool="name" data-pid="${esc(p.id)}" value="${esc(p.name)}">
      <select class="inp" data-pool="gender" data-pid="${esc(p.id)}"><option value="" ${!p.gender ? 'selected' : ''}>—</option><option value="F" ${p.gender === 'F' ? 'selected' : ''}>F</option><option value="M" ${p.gender === 'M' ? 'selected' : ''}>M</option></select>
      <label class="chk" title="Capitán"><input type="checkbox" data-pool="captain" data-pid="${esc(p.id)}" ${p.captain ? 'checked' : ''}>C</label>
      ${S.config.categories.filter(c => c.id !== cat).map(c => `<button class="btn sm ghost" data-act="movepool" data-pid="${esc(p.id)}" data-to="${esc(c.id)}" title="Mover a ${esc(c.name)}">→ ${esc(c.name)}</button>`).join('')}
      <button class="btn danger sm" data-act="delpool" data-pid="${esc(p.id)}" title="Eliminar del torneo">✕</button></div>`).join('') || '<div class="empty">No hay jugadores sin equipo. Pega una lista arriba.</div>'}</div>`;
}

function parsePlayers(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const parts = l.split(/[,;\t]/).map(x => x.trim());
    const g = (parts[1] || '').toLowerCase();
    return { name: parts[0], gender: /^(f|ni(ñ|n)a|fem)/.test(g) ? 'F' : /^(m|ni(ñ|n)o|masc)/.test(g) ? 'M' : '' };
  }).filter(p => p.name && !/^(nombre|jugador|name)$/i.test(p.name));
}

function readLogo(file) {
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 160 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/webp', 0.85));
    };
    img.onerror = () => bad(new Error('imagen no válida'));
    img.src = url;
  });
}

function gamesView(S) {
  const teams = S.teams.filter(t => t.cat === cat);
  const opts = teams.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');
  const games = S.games.filter(g => g.cat === cat).sort(UI.byDate);
  return `${catBar(S)}
    <div class="card" style="margin:12px 0"><div class="frm">
      ${field('Local', `<select class="inp" id="ng-h">${opts}</select>`)}
      ${field('Visitante', `<select class="inp" id="ng-a">${opts}</select>`)}
      ${field('Fecha y hora', `<input class="inp" type="datetime-local" id="ng-d" value="${nowLocal()}">`)}
      ${field('Modo de captura', `<select class="inp" id="ng-m">${T.MODES.map((m, i) => `<option value="${i}" ${i === 1 ? 'selected' : ''}>${m}</option>`).join('')}</select>`)}
      <button class="btn gold" data-act="addgame">Programar</button></div>
      <p class="note">Básico: puntos, faltas, tiempos muertos (las colectivas se cuentan solas). Intermedio: + rebotes, asistencias, robos, pérdidas, tapones y tiros fallados. Completo: + faltas recibidas.</p></div>
    <div class="gm-list">${games.map(g => `<div class="gm"><div><b>${esc(UI.team(S, g.home).name)}</b> vs <b>${esc(UI.team(S, g.away).name)}</b>
      <div class="muted" style="font-size:13px">${g.stage ? T.stageName(g) + ' · ' : ''}${UI.fmtDate(g.date)} ${UI.fmtTime(g.date)} · ${T.MODES[g.mode]} · ${g.status === 'final' ? 'Final ' + g.score.h + '–' + g.score.a : g.status === 'live' ? 'En vivo' : 'Programado'}</div></div>
      <div class="row"><a class="btn sm gold" href="mesa.html?id=${esc(g.id)}">Mesa</a><button class="btn sm danger" data-act="delgame" data-id="${esc(g.id)}">Eliminar</button></div></div>`).join('') || '<div class="empty">No hay partidos en esta categoría.</div>'}</div>`;
}

function drawView(S) {
  const nt = S.teams.filter(t => t.cat === cat).length;
  const lg = T.leagueGames(S, cat), played = lg.filter(g => g.status === 'final').length;
  const po = T.playoffGames(S, cat);
  const modes = id => `<select class="inp" id="${id}">${T.MODES.map((m, i) => `<option value="${i}" ${i === 1 ? 'selected' : ''}>${m}</option>`).join('')}</select>`;
  const gap = id => `<input class="inp" type="number" min="0" id="${id}" value="60">`;
  return `${catBar(S)}
    <h3 class="gold" style="margin:14px 0 8px;font-size:22px">1. Fase regular: todos contra todos</h3>
    <div class="card"><p class="muted">${nt} equipos → <b>${nt * (nt - 1) / 2}</b> partidos a una vuelta. El sistema sortea el orden y quién es local. Solo se enfrentan equipos de esta categoría.
      <br>Ahora: <b>${lg.length}</b> programados, <b>${played}</b> finalizados.</p>
      <div class="frm">${field('Fecha y hora del primer partido', `<input class="inp" type="datetime-local" id="dl-d" value="${nowLocal()}">`)}${field('Minutos entre partidos', gap('dl-gap'))}${field('Modo de captura', modes('dl-m'))}
      <button class="btn gold" data-act="drawleague">${lg.length ? 'Volver a sortear' : 'Sortear partidos'}</button></div></div>
    <h3 class="gold" style="margin:18px 0 8px;font-size:22px">2. Llaves</h3>
    <div class="card"><p class="muted">Se arman con los mejores de la tabla de posiciones (los partidos de llaves no cuentan en la tabla). Con 4 clasificados: semifinales 1.º vs 4.º y 2.º vs 3.º. Al terminar las semifinales usa <b>Generar final</b>.</p>
      <div class="frm">${field('Clasifican', '<select class="inp" id="dp-n"><option value="4">Los 4 mejores (semifinales y final)</option><option value="2">Los 2 mejores (solo final)</option></select>')}
      ${field('Partido por el tercer lugar', '<select class="inp" id="dp-third"><option value="0">No</option><option value="1">Sí</option></select>')}
      ${field('Fecha y hora del primer partido', `<input class="inp" type="datetime-local" id="dp-d" value="${nowLocal()}">`)}${field('Minutos entre partidos', gap('dp-gap'))}${field('Modo de captura', modes('dp-m'))}
      <div class="row"><button class="btn gold" data-act="drawplayoffs">${po.length ? 'Rehacer llaves' : 'Sortear llaves'}</button><button class="btn" data-act="advance">Generar final</button></div></div></div>
    <h3 class="gold" style="margin:18px 0 8px;font-size:22px">Así quedan las llaves</h3>
    ${UI.bracketView(S, cat)}
    <p class="note"><a href="llaves.html" style="color:var(--gold)">Ver la pantalla pública de llaves →</a> · Puedes cambiar la fecha o eliminar partidos en la pestaña Partidos.</p>`;
}

function rulesView(S) {
  const R = S.config.rules;
  const num = (k, label) => field(label, `<input class="inp" type="number" min="0" id="r-${k}" value="${R[k] ?? (k === 'onCourt' ? 5 : k === 'forfeitWin' ? 20 : k === 'forfeitLoss' ? 0 : '')}">`);
  return `<div class="card"><div class="frm">
      ${field('Nombre del torneo', `<input class="inp" id="r-name" value="${esc(S.config.name)}">`)}
      ${S.config.categories.map((c, i) => field('Categoría ' + (i + 1), `<input class="inp" id="r-cat${i}" value="${esc(c.name)}">`)).join('')}
    </div></div>
    <h3 class="gold" style="margin:18px 0 8px;font-size:22px">Tiempo de juego</h3>
    <div class="card"><div class="frm">${num('periods', 'Períodos (2 tiempos o 4 cuartos)')}${num('minutes', 'Minutos por período')}${num('otMinutes', 'Minutos de prórroga (se repite si sigue el empate)')}${num('timeouts', 'Tiempos muertos por equipo')}${field('Capitanes por equipo (sorteo)', `<input class="inp" type="number" min="1" id="r-capn" value="${S.config.captainsPerTeam || 2}">`)}${num('onCourt', 'Jugadores en cancha por equipo')}</div></div>
    <h3 class="gold" style="margin:18px 0 8px;font-size:22px">Faltas</h3>
    <div class="card"><div class="frm">${num('foulsOut', 'Faltas personales para eliminar al jugador')}${num('bonusFouls', 'Faltas colectivas por período para activar el bonus')}</div></div>
    <h3 class="gold" style="margin:18px 0 8px;font-size:22px">Puntos en la tabla</h3>
    <div class="card"><div class="frm">${num('ptsWin', 'Victoria')}${num('ptsDraw', 'Empate')}${num('ptsLoss', 'Derrota (participación)')}
      ${num('forfeitWin', 'No presentación: puntos del ganador')}${num('forfeitLoss', 'No presentación: puntos del que no llegó')}
      ${T.cloud ? '' : field('Actualización del público (segundos)', `<input class="inp" type="number" min="5" id="r-refresh" value="${S.config.refreshSec}">`)}</div></div>
    <p class="note">Los cambios de duración aplican a los partidos que aún no han iniciado.</p>
    <button class="btn gold" data-act="saverules" style="margin-top:12px">Guardar reglas</button>`;
}

function dataView() {
  return `<div class="card" style="display:grid;gap:14px">
    <div><h3 class="gold" style="font-size:22px">Respaldo</h3><p class="muted">Descarga todo el torneo en un archivo JSON, o restaura uno anterior. Sirve también para migrar a la versión del próximo año.</p>
      <div class="row"><button class="btn gold" data-act="export">Descargar respaldo</button><label class="btn ghost" style="cursor:pointer">Restaurar respaldo<input type="file" id="imp" accept="application/json" hidden></label></div></div>
    <div><h3 class="gold" style="font-size:22px">Datos de prueba</h3><p class="muted">${T.cloud ? '<b>Los datos están en la nube y los ve todo el público.</b> Estas acciones reemplazan lo que hay en el torneo real.' : 'Modo local: todo se guarda solo en este navegador.'}</p>
      <div class="row"><button class="btn" data-act="seed">Restaurar datos de ejemplo</button></div></div>
    <div><h3 class="gold" style="font-size:22px">Reinicio real</h3>
      <p class="muted">Deja el torneo listo para el evento: nombre <b>Torneo interno Hoopz</b>, categorías <b>U12</b> (Mickey, Olaf, Woody, Nemo) y <b>Plus 12</b> (Rayo, Buzz, Mike, Simba, Stitch, Donald), con las listas de jugadores (17 en U12, 34 en Plus 12; los 7 que estaban en ambas listas quedan solo en U12) en la lista sin equipo para el sorteo, sin partidos ni estadísticas. Conserva las reglas actuales.</p>
      <div class="row"><button class="btn danger" data-act="realreset">Reinicio real</button></div></div>
    <div><h3 class="gold" style="font-size:22px">Reiniciar torneo</h3>
      <p class="muted"><b>Reiniciar resultados</b> conserva equipos, jugadores y calendario, pero borra marcadores, jugadas y estadísticas: todos los partidos vuelven a "Programado" con el reloj en cero y la tabla de posiciones queda en ceros. <b>Borrar todo</b> elimina además los equipos y los partidos.</p>
      <div class="row"><button class="btn danger" data-act="resetgames">Reiniciar resultados</button><button class="btn danger" data-act="wipe">Borrar todo (torneo vacío)</button></div></div></div>`;
}

/* Monitoreo: dispositivos conectados ahora y lecturas/escrituras del día (suma de lo que reporta cada dispositivo) */
const ONLINE_MS = 300000, QUOTA = { reads: 50000, writes: 20000 };
const PAGES = { index: 'Inicio', partido: 'Partido', posiciones: 'Posiciones', llaves: 'Llaves', resultados: 'Resultados', estadisticas: 'Estadísticas', tv: 'Marcador TV', mesa: 'Mesa', admin: 'Administración', sorteo: 'Sorteo', presentacion: 'Presentación' };
let unUsage = null, lastUsage = null;
function monitorView() {
  if (!T.cloud || !T.watchUsage) return '<div class="card"><p class="muted">El monitoreo solo funciona con los datos en la nube (no en modo local).</p></div>';
  return '<div id="mon">' + monitorHtml(lastUsage) + '</div>';
}
function monitorHtml(m) {
  if (!m) return '<div class="empty">Cargando…</div>';
  if (m.err) return `<div class="card"><p class="muted">No se pudo leer el monitoreo (${esc(m.err.code || m.err.message)}). Revisa que las reglas de Firestore incluyan la colección <b>presence</b>.</p></div>`;
  const now = Date.now(), list = m.docs;
  const online = list.filter(d => now - d.t < ONLINE_MS);
  const reads = list.reduce((n, d) => n + (d.reads || 0), 0), writes = list.reduce((n, d) => n + (d.writes || 0), 0);
  const byPage = {}; online.forEach(d => { byPage[d.page] = (byPage[d.page] || 0) + 1; });
  const bar = (v, max) => { const p = Math.min(100, v / max * 100); return `<div style="height:8px;background:#222;border-radius:4px;margin-top:6px"><div style="height:8px;width:${p}%;background:${p > 70 ? '#e53935' : 'var(--gold,#c9a84c)'};border-radius:4px"></div></div>`; };
  const tile = (label, v, extra) => `<div class="card" style="text-align:center"><div class="muted" style="font-size:13px">${label}</div><div class="gold" style="font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1.1">${v.toLocaleString('es')}</div>${extra || ''}</div>`;
  return `<div class="cols">
      ${tile('Conectados ahora', online.length, `<div class="muted" style="font-size:12px">${Object.entries(byPage).map(([k, n]) => `${esc(PAGES[k] || k)}: ${n}`).join(' · ') || 'nadie'}</div>`)}
      ${tile('Dispositivos hoy', list.length, '<div class="muted" style="font-size:12px">distintos que abrieron la app</div>')}
      ${tile('Lecturas hoy', reads, bar(reads, QUOTA.reads) + `<div class="muted" style="font-size:12px">${(reads / QUOTA.reads * 100).toFixed(1)}% de ${QUOTA.reads.toLocaleString('es')}</div>`)}
      ${tile('Escrituras hoy', writes, bar(writes, QUOTA.writes) + `<div class="muted" style="font-size:12px">${(writes / QUOTA.writes * 100).toFixed(1)}% de ${QUOTA.writes.toLocaleString('es')}</div>`)}
    </div>
    <p class="note">"Conectado" = latido en los últimos 5 min con la pantalla visible. Las lecturas y escrituras son la suma de lo que reporta cada dispositivo (con hasta ~2 min de retraso) e incluyen los latidos de este monitoreo. Es una estimación: la cifra exacta está en Firebase → Uso. Las cuotas se reinician a medianoche (hora del Pacífico). Mientras esta sección está abierta, cada latido recibido cuenta como una lectura.</p>`;
}
function stopUsage() { if (unUsage) { unUsage(); unUsage = null; } }
function startUsage() {
  if (unUsage || !T.cloud || !T.watchUsage) return;
  unUsage = T.watchUsage((docs, mine, err) => {
    lastUsage = err ? { err } : { docs: docs || [], mine };
    const el = document.getElementById('mon');
    if (el) el.innerHTML = monitorHtml(lastUsage);
  });
}
setInterval(() => { const el = document.getElementById('mon'); if (el && lastUsage && !lastUsage.err) el.innerHTML = monitorHtml(lastUsage); }, 30000);

function render() {
  const S = T.state();
  if (tab === 'monitor') startUsage(); else stopUsage();
  app.innerHTML = `<h1 class="page-title">Administración del <b>torneo</b></h1>
    <div class="tabs">${TABS.map(([k, l]) => `<button data-act="tab" data-id="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${tab === 'teams' ? teamsView(S) : tab === 'pool' ? poolView(S) : tab === 'games' ? gamesView(S) : tab === 'draw' ? drawView(S) : tab === 'rules' ? rulesView(S) : tab === 'monitor' ? monitorView() : dataView()}`;
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  const mt = fn => { T.mutate(s => fn(s)); render(); };
  switch (b.dataset.act) {
    case 'tab': tab = id; render(); break;
    case 'cat': cat = id; try { localStorage.setItem('torneo.cat', id); } catch (er) { /* ignore */ } render(); break;
    case 'toggle': openTeam = openTeam === id ? null : id; render(); break;
    case 'addteam': {
      const name = val('nt-name');
      if (!name) return UI.toast('Escribe el nombre del equipo', 'bad');
      const colors = ['#c9a84c', '#e53935', '#1e88e5', '#43a047', '#8e24aa', '#fb8c00', '#00acc1', '#d81b60'];
      const tid = T.uid('t');
      mt(s => s.teams.push({ id: tid, cat, name, coach: val('nt-coach'), coaches: val('nt-coach') ? [val('nt-coach')] : [], color: colors[s.teams.length % colors.length], players: [] }));
      openTeam = tid; render(); break;
    }
    case 'addcoach': {
      const name = val('nc-name-' + id);
      if (!name) return UI.toast('Escribe el nombre del coach', 'bad');
      if (T.coachList(T.state().teams.find(t => t.id === id)).some(c => c.toLowerCase() === name.toLowerCase())) return UI.toast('Ese coach ya está en el equipo', 'bad');
      mt(s => { const t = s.teams.find(x => x.id === id); T.setCoaches(t, T.coachList(t).concat(name)); }); break;
    }
    case 'p2coach': {
      const t0 = T.state().teams.find(t => t.id === id), p0 = t0.players.find(p => p.id === b.dataset.p);
      if (!p0) return;
      if (T.coachList(t0).includes(p0.name)) return UI.toast(p0.name + ' ya es coach del equipo');
      mt(s => { const t = s.teams.find(x => x.id === id); T.setCoaches(t, T.coachList(t).concat(p0.name)); });
      UI.toast(p0.name + ' agregado como coach'); break;
    }
    case 'delcoach': e.preventDefault(); mt(s => { const t = s.teams.find(x => x.id === id); T.setCoaches(t, T.coachList(t).filter((c, i) => i !== +b.dataset.i)); }); break;
    case 'delteam':
      if (confirm('¿Eliminar el equipo y sus partidos?')) mt(s => { s.teams = s.teams.filter(t => t.id !== id); s.games = s.games.filter(g => g.home !== id && g.away !== id); });
      break;
    case 'addpl': {
      const num = parseInt(document.getElementById('np-num').value, 10), name = val('np-name');
      if (isNaN(num) || !name) return UI.toast('Escribe número y nombre', 'bad');
      const t = T.state().teams.find(x => x.id === id);
      if (t.players.some(p => p.num === num)) return UI.toast('Ese número ya existe en el equipo', 'bad');
      mt(s => s.teams.find(x => x.id === id).players.push({ id: T.uid('p'), num, name, gender: document.getElementById('np-g').value })); break;
    }
    case 'delpl': if (confirm('¿Quitar al jugador? Sus estadísticas en partidos ya jugados se conservan en el historial.')) mt(s => { const t = s.teams.find(x => x.id === id); t.players = t.players.filter(p => p.id !== b.dataset.p); }); break;
    case 'addpool': {
      const items = parsePlayers(document.getElementById('pool-text').value);
      if (!items.length) return UI.toast('Pega al menos un nombre', 'bad');
      const S2 = T.state();
      const seen = new Set(S2.teams.flatMap(t => t.players).concat(T.draft(S2, cat).pool, ...Object.values(S2.draft || {}).map(x => x.pool || [])).map(p => p.name.toLowerCase()));
      const fresh = items.filter(p => { const k = p.name.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
      mt(s => { const dd = T.draftW(s, cat); fresh.forEach(p => dd.pool.push({ id: T.uid('p'), name: p.name, gender: p.gender, captain: false })); });
      UI.toast(`${fresh.length} agregados` + (items.length - fresh.length ? `, ${items.length - fresh.length} repetidos omitidos` : '')); break;
    }
    case 'movepool': {
      const to = b.dataset.to, S2 = T.state();
      const p0 = T.draft(S2, cat).pool.find(x => x.id === b.dataset.pid);
      if (!p0) return;
      if (T.draft(S2, to).pool.some(x => keyOf(x.name) === keyOf(p0.name))) return UI.toast('Ya hay alguien con ese nombre en esa categoría: usa el aviso de repetidos', 'bad');
      mt(s => { const from = T.draftW(s, cat), dest = T.draftW(s, to); from.pool = from.pool.filter(x => x.id !== p0.id); dest.pool.push(p0); });
      UI.toast(`${p0.name} movido a ${UI.catName(S2, to)}`); break;
    }
    case 'dupkeep': {
      const S2 = T.state(), ents = (findDupes(S2).find(([k]) => k === b.dataset.k) || [, []])[1].filter(e => e.cat !== b.dataset.c);
      if (!ents.length) return;
      if (ents.some(e => e.where !== 'sin equipo') && !confirm('Alguno ya tiene equipo: se quitará también del equipo. ¿Continuar?')) return;
      mt(s => ents.forEach(e => removeEntry(s, e)));
      UI.toast(`Quedó solo en ${UI.catName(S2, b.dataset.c)}`); break;
    }
    case 'dupall': {
      const S2 = T.state(), ents = (findDupes(S2).find(([k]) => k === b.dataset.k) || [, []])[1];
      if (!ents.length || !confirm('¿Quitar a este jugador de todas las categorías? Se elimina del torneo.')) return;
      mt(s => ents.forEach(e => removeEntry(s, e)));
      UI.toast('Jugador quitado del torneo'); break;
    }
    case 'delpool': mt(s => { const dd = T.draftW(s, cat); dd.pool = dd.pool.filter(p => p.id !== b.dataset.pid); }); break;
    case 'clearpool': if (confirmDanger('Se vaciará la lista de jugadores sin equipo.')) mt(s => { T.draftW(s, cat).pool = []; }); break;
    case 'dellogo': mt(s => { delete s.teams.find(t => t.id === id).logo; }); break;
    case 'addgame': {
      const h = val('ng-h'), a = val('ng-a'), d = val('ng-d');
      if (!h || !a || h === a) return UI.toast('Elige dos equipos distintos', 'bad');
      if (!d) return UI.toast('Elige fecha y hora', 'bad');
      mt(s => s.games.push(T.newGame({ cat, home: h, away: a, date: d, mode: +val('ng-m') })));
      UI.toast('Partido programado'); break;
    }
    case 'delgame': if (confirm('¿Eliminar el partido y sus jugadas?')) mt(s => { s.games = s.games.filter(g => g.id !== id); }); break;
    case 'drawleague': {
      const d = val('dl-d');
      if (!d) return UI.toast('Elige fecha y hora del primer partido', 'bad');
      const S0 = T.state(), prev = T.leagueGames(S0, cat);
      if (S0.teams.filter(t => t.cat === cat).length < 2) return UI.toast('Se necesitan al menos 2 equipos', 'bad');
      if (prev.some(g => g.status !== 'scheduled')) return UI.toast('Ya hay partidos iniciados o finalizados: no se puede volver a sortear', 'bad');
      if (prev.length && !confirm(`Ya hay ${prev.length} partidos programados en esta categoría. ¿Reemplazarlos por un nuevo sorteo?`)) return;
      let n = 0;
      mt(s => { n = T.drawLeague(s, cat, { start: d, gapMin: Math.max(0, +val('dl-gap') || 0), mode: +val('dl-m') }); });
      UI.toast(`${n} partidos sorteados`); break;
    }
    case 'drawplayoffs': {
      const d = val('dp-d'), n = +val('dp-n');
      if (!d) return UI.toast('Elige fecha y hora del primer partido', 'bad');
      const S0 = T.state(), lg = T.leagueGames(S0, cat), prev = T.playoffGames(S0, cat);
      if (S0.teams.filter(t => t.cat === cat).length < n) return UI.toast(`Se necesitan al menos ${n} equipos`, 'bad');
      if (prev.some(g => g.status !== 'scheduled')) return UI.toast('Ya hay llaves iniciadas o finalizadas: no se pueden rehacer', 'bad');
      const left = lg.filter(g => g.status !== 'final').length;
      if ((!lg.length || left) && !confirm(!lg.length ? 'No hay fase regular: las llaves saldrían de una tabla en ceros. ¿Continuar?' : `Faltan ${left} partidos de la fase regular. ¿Armar las llaves con la tabla actual?`)) return;
      if (prev.length && !confirm('Ya hay llaves programadas. ¿Reemplazarlas?')) return;
      mt(s => { T.drawPlayoffs(s, cat, { start: d, gapMin: Math.max(0, +val('dp-gap') || 0), mode: +val('dp-m'), n, third: val('dp-third') === '1' }); });
      UI.toast('Llaves sorteadas'); break;
    }
    case 'advance': {
      const d = val('dp-d');
      if (!d) return UI.toast('Elige fecha y hora de la final', 'bad');
      let r;
      mt(s => { r = T.advancePlayoffs(s, cat, { start: d, gapMin: Math.max(0, +val('dp-gap') || 0), mode: +val('dp-m') }); });
      UI.toast({ ok: 'Final generada', nosf: 'Primero sortea las llaves con semifinales', exists: 'La final ya existe', pending: 'Faltan semifinales por terminar', tie: 'Una semifinal quedó empatada: define el ganador' }[r], r === 'ok' ? '' : 'bad'); break;
    }
    case 'saverules': {
      const keys = ['periods', 'minutes', 'otMinutes', 'timeouts', 'onCourt', 'foulsOut', 'bonusFouls', 'ptsWin', 'ptsDraw', 'ptsLoss', 'forfeitWin', 'forfeitLoss'];
      mt(s => {
        s.config.name = val('r-name') || s.config.name;
        s.config.categories.forEach((c, i) => { c.name = val('r-cat' + i) || c.name; });
        s.config.captainsPerTeam = Math.max(1, +document.getElementById('r-capn').value || 2);
        keys.forEach(k => { s.config.rules[k] = Math.max(0, +document.getElementById('r-' + k).value || 0); });
        if (document.getElementById('r-refresh')) s.config.refreshSec = Math.max(5, +document.getElementById('r-refresh').value || 15);
        s.games.filter(g => g.status === 'scheduled').forEach(g => { g.clock.remainingMs = T.periodLen(1); });
      });
      UI.toast('Reglas guardadas'); break;
    }
    case 'export': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(T.state(), null, 2)], { type: 'application/json' }));
      a.download = 'torneo-respaldo-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); break;
    }
    case 'seed': if (confirmDanger('Se reemplazará todo por los datos de ejemplo.')) { T.replaceAll(Seed.build()); render(); UI.toast('Datos de ejemplo restaurados'); } break;
    case 'resetgames':
      if (confirmDanger('Se borrarán marcadores, jugadas y estadísticas de TODOS los partidos. Los equipos y el calendario se conservan.')) {
        mt(s => s.games.forEach(g => {
          g.status = 'scheduled'; g.score = { h: 0, a: 0 }; g.events = [];
          g.clock = { period: 1, running: false, remainingMs: T.periodLen(1), startedAt: null };
        }));
        UI.toast('Torneo reiniciado: todos los partidos en cero');
      }
      break;
    case 'realreset':
      if (confirmDanger('Se reemplazará TODO (equipos, jugadores, partidos y estadísticas) por los 10 equipos reales: U12 (4) y Plus 12 (6).')) {
        const old = T.state().config;
        const cats = [
          { id: 'u12', name: 'U12', teams: [['Mickey', '#e53935'], ['Olaf', '#00acc1'], ['Woody', '#8d6e63'], ['Nemo', '#fb8c00']] },
          { id: 'plus12', name: 'Plus 12', teams: [['Rayo', '#d81b60'], ['Buzz', '#8e24aa'], ['Mike', '#43a047'], ['Simba', '#c9a84c'], ['Stitch', '#1e88e5'], ['Donald', '#3949ab']] }
        ];
        const config = Object.assign({}, old, { name: 'Torneo interno Hoopz', categories: cats.map(c => ({ id: c.id, name: c.name })) });
        const teams = cats.flatMap(c => c.teams.map(([n, color]) => ({ id: T.uid('t'), cat: c.id, name: 'Team ' + n, coach: '', color, players: [] })));
        /* Listas de jugadores sin equipo (para el sorteo). El género se deduce del nombre; se deja vacío si es ambiguo (ajustable en la pestaña Jugadores). */
        const FEM = new Set(['Sara', 'Valentina', 'Elizabeth', 'Luciana', 'Mariana', 'Naomy', 'Krisna', 'Liah', 'Maria', 'Lucia', 'Amanda', 'Celeste', 'Mia', 'Sareth']);
        const MAS = new Set(['Ben', 'Mateo', 'Diego', 'Bastian', 'Connor', 'Luka', 'Santiago', 'Liang', 'Thiago', 'Gael', 'Jonathan', 'Dylan', 'James', 'Julian', 'Ismael', 'Mathias', 'Joao', 'Samir', 'Ian', 'Luis', 'Mauricio', 'Juan', 'Jhon', 'Itay', 'Hudson', 'Samuel', 'David', 'Derek', 'Sam', 'River']);
        const gender = n => { const f = n.split(' ')[0]; return FEM.has(f) ? 'F' : MAS.has(f) ? 'M' : ''; };
        const LISTS = {
          u12: ['Ben Kenigsvain', 'Sara Roldan', 'Mateo Fernandez', 'Valentina Arias', 'Diego Hernandez', 'Elizabeth Cordero', 'Bastian Soto', 'Luciana Chacon', 'Connor Pladl', 'Mariana Quesada', 'Luka Miranda', 'Santiago Marín', 'Liang Mora', 'Thiago Duran', 'Gael Rivera', 'Jonathan Zenan Ocean', 'Dylan Araya'],
          plus12: ['Naomy Amen Obando', 'Sam O Neill Sweet', 'James Wilfong Valverde', 'Krisna Naranjo Chacon', 'Gael Morales Mora', 'Julian Fernandez Chacon', 'Liah Quesada Aguero', 'Ismael Fonseca Ugalde', 'Mathias Herrera Vargas', 'Joao Navas Cordero', 'Samir Fernandez Mora', 'Santiago Sibaja Salas', 'Ian Oguilve Aguero', 'Luis Correa Fernandez', 'Maria F Mora Elizondo', 'Dylan Quesada Rivera', 'Mauricio Castillo Arce', 'Lucia Amen Valverde', 'Juan D León Bonilla', 'Jhon Burgos Araya', 'Sareth Jimenez Mena', 'River Hermance Jimenez', 'Julian Fernandez Brenes', 'Amanda Segura Acuña', 'Ismael O Neill Sweet', 'Itay Kenigsvain', 'Celeste Gonzales Guisao', 'Hudson Oconnor', 'Luis Acuña Acuña', 'Mia Azcurra', 'Mathias Castillo Mena', 'Samuel Madrigal Solano', 'David Padilla Fallas', 'Derek Aguero Alfaro']
        };
        const draft = {};
        Object.keys(LISTS).forEach(k => { draft[k] = { pool: LISTS[k].map(n => ({ id: T.uid('p'), name: n, gender: gender(n), captain: false })), last: null, group: null, done: [] }; });
        T.replaceAll({ v: 1, config, teams, games: [], draft });
        cat = cats[0].id; render(); UI.toast('Reinicio real aplicado: 10 equipos y listas de jugadores cargados');
      }
      break;
    case 'wipe': if (confirmDanger('Se borrarán equipos, jugadores, partidos y estadísticas.')) { const s = T.state(); T.replaceAll({ v: 1, config: s.config, teams: [], games: [], draft: {} }); render(); UI.toast('Torneo vacío'); } break;
  }
});

/* Edición en línea de equipo y jugadores */
app.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'imp') {
    const f = el.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const s = JSON.parse(r.result); if (!s.teams || !s.games || !s.config) throw 0; T.replaceAll(s); render(); UI.toast('Respaldo restaurado'); } catch (er) { UI.toast('Archivo no válido', 'bad'); } };
    r.readAsText(f); return;
  }
  if (el.id === 'pool-file') {
    const f = el.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { document.getElementById('pool-text').value = String(r.result); };
    r.readAsText(f); return;
  }
  if (el.dataset.logo) {
    const f = el.files[0]; if (!f) return;
    readLogo(f).then(url => { T.mutate(s => { s.teams.find(t => t.id === el.dataset.logo).logo = url; }); render(); UI.toast('Logo guardado'); })
      .catch(() => UI.toast('No se pudo leer la imagen', 'bad'));
    return;
  }
  if (el.dataset.pool) { T.mutate(s => { const p = T.draftW(s, cat).pool.find(x => x.id === el.dataset.pid); p[el.dataset.pool] = el.dataset.pool === 'captain' ? el.checked : el.value; }); return; }
  if (el.dataset.f) T.mutate(s => { s.teams.find(t => t.id === el.dataset.id)[el.dataset.f] = el.value; });
  if (el.dataset.pf === 'num') {
    const n = parseInt(el.value, 10) || 0, t0 = T.state().teams.find(t => t.id === el.dataset.id);
    if (t0.players.some(p => p.id !== el.dataset.p && p.num === n)) { UI.toast('Ese número ya lo tiene otro jugador del equipo', 'bad'); render(); return; }
  }
  if (el.dataset.pf) T.mutate(s => { const p = s.teams.find(t => t.id === el.dataset.id).players.find(x => x.id === el.dataset.p); p[el.dataset.pf] = el.dataset.pf === 'num' ? parseInt(el.value, 10) || 0 : el.dataset.pf === 'captain' ? el.checked : el.value; });
});

UI.gate(app, start);
});
</script>
