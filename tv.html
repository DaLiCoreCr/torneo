<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcador TV · Torneo interno Hoopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=66">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoopz">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
/* Espera entre partidos: escudo girando como moneda dentro de un anillo dorado (solo CSS) */
.tv-wait { position: relative; width: clamp(80px, 9vw, 170px); aspect-ratio: 1; margin: 0 auto clamp(6px, 1vw, 14px); display: grid; place-items: center; perspective: 600px; }
.tv-wait::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(201,168,76,.18); border-top-color: var(--gold); border-right-color: var(--gold); animation: tvspin 1.8s linear infinite; }
.tv-wait img { width: 74%; height: auto; animation: tvcoin 4s linear infinite; }
@keyframes tvspin { to { transform: rotate(360deg); } }
@keyframes tvcoin { to { transform: rotateY(360deg); } }
@media (prefers-reduced-motion: reduce) { .tv-wait::before, .tv-wait img { animation: none; } }
</style>
</head>
<body>
<main><div class="wrap tvwrap"><div id="app"></div></div></main>
<script src="js/firebase-config.js?v=66"></script>
<script src="js/core.js?v=66"></script>
<script src="js/seed.js?v=66"></script>
<script src="js/ui.js?v=66"></script>
<script>
T.load().then(() => {
UI.layout('');
document.body.classList.add('tv');
const { esc, ACTIONS } = T;
const app = document.getElementById('app');
const fixed = new URLSearchParams(location.search).get('id');

/* Partido a mostrar: el indicado en ?id=, o el que está en vivo (no se cambia hasta que se finalice), o el próximo, o el último */
/* Al terminar un partido se deja su resultado HOLD_MS y luego se pasa solo al siguiente (en vivo, o el próximo programado). */
const HOLD_MS = 180000; // 3 min con el resultado; si arranca otro partido antes, se cambia de inmediato o con un clic en la pantalla
let lastHtml = '';
let cur = null, curOpen = false, holdUntil = 0, holdTimer = null, holding = false;

/* Bocina de fin de período (estilo NBA). Solo suena en esta pantalla. El navegador exige un clic para permitir audio. */
let actx = null, sndOn = true;
try { sndOn = localStorage.getItem('torneo.tvSound') !== '0'; } catch (e) {}
function sndLabel() { return !sndOn ? '🔇 Sonido apagado' : (actx && actx.state === 'running') ? '🔊 Sonido activo' : '🔊 Sonido listo (toca la pantalla)'; }
function sndUnlock() {
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { actx = new AC(); actx.onstatechange = () => { lastHtml = ''; render(); }; } }
    if (actx && actx.state !== 'running') actx.resume();
  } catch (e) {}
}
/* El sonido queda activo de forma automática: se intenta al abrir la pantalla, y cualquier toque/tecla en la TV lo habilita (el navegador no deja sonar sin una interacción previa) */
let runAtDown = false;
['pointerdown', 'keydown', 'touchstart', 'click'].forEach(ev => document.addEventListener(ev, () => { if (ev !== 'click') runAtDown = !!(actx && actx.state === 'running'); if (sndOn && !(actx && actx.state === 'running')) sndUnlock(); }, true));
sndUnlock();
function sndBlocked() { return sndOn && !(actx && actx.state === 'running'); }
const SND_BUZZER = 'assets/sounds/nba.wav';
const bufs = {}, loading = {};
function loadFile(url) { // cada archivo se descarga y decodifica una sola vez
  if (!loading[url]) loading[url] = fetch(url).then(r => r.arrayBuffer()).then(b => new Promise((ok, no) => actx.decodeAudioData(b, ok, no))).then(b => { bufs[url] = b; }).catch(() => { delete loading[url]; });
  return loading[url];
}
function playFile(url) {
  if (!bufs[url]) { loadFile(url).then(() => { if (bufs[url]) playFile(url); }); return; }
  const src = actx.createBufferSource(), g = actx.createGain(); g.gain.value = 1;
  src.buffer = bufs[url]; src.connect(g); g.connect(actx.destination); src.start();
}
function playSound(url) {
  if (!actx || actx.state !== 'running') return;
  playFile(url || SND_BUZZER);
}
function preloadSounds() { if (actx) loadFile(SND_BUZZER); }
function buzzer() { if (sndOn) playSound(SND_BUZZER); }
/* Detecta el paso del reloj a 0:00 del partido que se muestra (no suena al abrir la página con el período ya terminado) */
let prevRem = null, prevKey = '';
setInterval(() => {
  const g = cur && T.game(cur);
  if (!g || g.status !== 'live') { prevRem = null; return; }
  const key = g.id + ':' + g.clock.period, rem = T.remaining(g);
  if (key === prevKey && prevRem !== null && prevRem > 0 && rem <= 0) buzzer();
  prevKey = key; prevRem = rem;
}, 200);

function pick(S) {
  if (fixed && T.game(fixed)) return T.game(fixed);
  const now = Date.now();
  holding = false;
  if (cur) {
    const g = T.game(cur);
    if (!g) cur = null;
    else if (g.status === 'final' && curOpen) { // acaba de terminar: se mantiene el resultado unos segundos
      if (!holdUntil) holdUntil = now + HOLD_MS;
      if (S.games.some(x => x.status === 'live' && x.id !== g.id)) holdUntil = now - 1; // ya inició otro partido: no se espera más
      if (now < holdUntil) {
        holding = true;
        clearTimeout(holdTimer); holdTimer = setTimeout(render, holdUntil - now + 50);
        return g;
      }
      cur = null; holdUntil = 0;
    } else if (g.status === 'live') { curOpen = true; return g; } // partido en curso: no se cambia hasta que se finalice
    else if (g.status === 'final') cur = null;
  }
  const live = S.games.filter(g => g.status === 'live');
  let g;
  if (live.length) g = live.sort(UI.byDate)[0];
  else g = S.games.filter(g => g.status === 'scheduled').sort(UI.byDate)[0] || S.games.filter(g => g.status === 'final').sort((a, b) => UI.byDate(b, a))[0];
  if (g) { cur = g.id; curOpen = g.status !== 'final'; }
  return g;
}

function render() {
  const S = T.state();
  const g = pick(S);
  if (!g) { app.innerHTML = '<div class="empty" style="margin-top:30px">No hay partidos para mostrar.</div>'; return; }
  const R = S.config.rules, h = UI.team(S, g.home), a = UI.team(S, g.away);
  const live = g.status === 'live', fin = g.status === 'final';
  const per = g.clock.period;
  const tf = side => T.teamFouls(g, side, per);
  const tm = side => Math.max(0, R.timeouts - T.timeoutsUsed(g, side));
  const box = (t, side) => {
    const other = side === 'h' ? 'a' : 'h';
    const n = tf(side);
    return `<div class="tv-t ${fin && g.score[side] > g.score[other] ? 'win' : ''}" style="--tc:${esc(t.color || '#c9a84c')}">
      ${UI.badge(t)}<h2>${esc(t.name)}</h2>
      <div class="tv-sc" data-sc="${esc(g.id)}:${side}">${g.status === 'scheduled' ? '–' : g.score[side]}</div>
      <div class="tv-meta"><span class="fouls">${Array.from({ length: R.bonusFouls }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>
        ${n >= R.bonusFouls ? '<span class="bonus">EN COLECTIVAS</span>' : '<small>COLECTIVAS</small>'}<small>T. MUERTOS ${tm(side)}</small></div></div>`;
  };
  const idx = T.playerIndex(S);
  const plays = g.events.filter(e => ACTIONS[e.type].pts).slice(-4).reverse().map(e => {
    const p = idx[e.pid];
    return `<li><span class="t">${e.nt ? '–' : T.periodLabel(e.p) + ' ' + T.fmtClock(e.c)}</span>${UI.badge(UI.team(S, e.team === 'h' ? g.home : g.away))}<span>${p ? '#' + p.p.num + ' ' + esc(p.p.name) : ''}</span><span class="pts">+${ACTIONS[e.type].pts}</span></li>`;
  }).join('');
  const html = `
    <div class="tv-top"><span>${esc(UI.catName(S, g.cat))} · ${UI.fmtDate(g.date)} ${UI.fmtTime(g.date)}</span>
      ${live ? '<span class="chip live"><i class="dot"></i>EN VIVO</span>' : fin ? `<span class="chip">${g.forfeit ? 'W.O.' : 'FINAL'}</span>` : '<span class="chip soft">PRÓXIMO</span>'}
      ${live && sndBlocked() ? '<span class="chip soft" style="border-color:var(--gold);color:var(--gold)">⚠ SONIDO BLOQUEADO POR EL NAVEGADOR · TOCA LA PANTALLA UNA VEZ</span>' : ''}
      ${holding ? '<span class="chip soft">SIGUIENTE PARTIDO EN <b id="holdcd"></b> · TOCA LA PANTALLA PARA SALTAR</span>' : ''}
      <a class="btn sm ghost" href="index.html">← Inicio</a><button class="btn sm ghost" id="sndtest">▶ Probar</button><button class="btn sm ghost" id="fs">${document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa'}</button></div>
    <div class="tv-board ${live ? 'is-live' : ''}">${box(h, 'h')}
      <div class="tv-mid">${live || fin ? '' : '<div class="tv-wait" aria-hidden="true"><img src="assets/logo-boleta.png" alt=""></div>'}<div class="clk" data-gid="${esc(g.id)}">${UI.clockText(g)}</div></div>${box(a, 'a')}</div>
    ${plays ? `<ul class="plays tv-plays">${plays}</ul>` : ''}`;
  if (html === lastHtml) return; // sin cambios: no se reescribe, así la animación de espera no se reinicia
  lastHtml = html;
  app.innerHTML = html;
  UI.scoreFx();
}

const fmtLeft = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
setInterval(() => { const el = document.getElementById('holdcd'); if (el && holding) el.textContent = fmtLeft(holdUntil - Date.now()); }, 500);
app.addEventListener('click', e => {
  if (e.target.id === 'sndtest') { sndUnlock(); const go = () => playSound(); if (actx && actx.state === 'running') go(); else if (actx) actx.resume().then(go); return; }
  if (sndOn) sndUnlock();
  if (holding && !e.target.closest('a,button,select')) { holdUntil = Date.now() - 1; render(); return; } // salta la espera
  if (e.target.id === 'fs') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
});
document.addEventListener('fullscreenchange', () => render());
render();
T.subscribe(render);
setInterval(render, 5000);
});
</script>
</body>
</html>
