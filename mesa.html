<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa de anotación · Torneo interno Hoopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=65">
<style>
  /* Color de camiseta de cada equipo (se elige antes del partido y se usa en Hoopz Live) */
  .kit { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: var(--k, #888); vertical-align: -1px; margin-right: 6px; }
  .kitrow { display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; margin: 0 0 10px; font-size: 13px; }
  .kitrow .kp { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .kitrow .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); cursor: pointer; padding: 0; }
  .kitrow .sw.on { outline: 3px solid var(--gold, #c9a84c); outline-offset: 1px; }
  .kitrow input[type=color] { width: 30px; height: 26px; padding: 0; border: 0; background: none; cursor: pointer; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoopz">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<main><div class="wrap mesa"><div id="app"></div></div></main>
<script src="js/firebase-config.js?v=65"></script>
<script src="js/core.js?v=65"></script>
<script src="js/seed.js?v=65"></script>
<script src="js/ui.js?v=65"></script>
<script>
T.load().then(() => {
UI.layout('');
const { esc, ACTIONS } = T;
const app = document.getElementById('app');
let gid = new URLSearchParams(location.search).get('id');
let side = 'h', sel = null, adjusting = false, subMode = false, endDismissed = null;

/* Tamaño de la mesa para tablets: A−/A+ (60 % a 120 %) o Auto, que la ajusta sola para que quepa en la pantalla. Se recuerda en este dispositivo. */
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } } };
let zoom = Math.min(1.2, Math.max(0.6, +store.get('torneo.mesaZoom') || 1)), autoFit = store.get('torneo.mesaAuto') === '1';
function applyZoom() {
  const el = document.querySelector('.wrap.mesa');
  if (!el) return;
  document.body.style.paddingBottom = '';
  if (autoFit) {
    el.style.zoom = 1;
    const h = document.documentElement.scrollHeight;
    zoom = h > innerHeight ? Math.max(0.6, Math.floor((innerHeight / h) * 0.985 * 100) / 100) : 1;
  }
  el.style.zoom = zoom === 1 ? '' : zoom;
  const bz = document.querySelector('[data-act="za"]');
  if (bz) bz.textContent = 'Auto' + (autoFit ? ' ' + Math.round(zoom * 100) + '%' : '');
}
addEventListener('resize', () => { if (autoFit && gid) render(); });


function start() { render(); T.subscribe(render); setInterval(watchClock, 500); }

/* Pausa sola al llegar a 0:00 */
function watchClock() {
  const g = gid && T.game(gid);
  if (g && g.clock.running && T.remaining(g) <= 0) {
    T.mutate(s => T.pauseClock(s.games.find(x => x.id === gid)));
    UI.toast('Fin del período ' + T.periodLabel(g.clock.period));
  }
}

function picker(S) {
  const open = S.games.filter(g => g.status !== 'final').sort((a, b) => (a.status === 'live' ? 0 : 1) - (b.status === 'live' ? 0 : 1) || UI.byDate(a, b));
  const fin = S.games.filter(g => g.status === 'final').sort((a, b) => UI.byDate(b, a));
  const row = g => `<div class="gm"><div><b>${esc(UI.team(S, g.home).name)}</b> vs <b>${esc(UI.team(S, g.away).name)}</b>
      <div class="muted" style="font-size:13px">${esc(UI.catName(S, g.cat))} · ${UI.fmtDate(g.date)} ${UI.fmtTime(g.date)} · Captura ${T.MODES[g.mode]}</div></div>
      <div class="row">${g.status === 'live' ? '<span class="chip live"><i class="dot"></i>EN VIVO</span>' : ''}${g.status === 'final' ? `<span class="chip">${g.score.h}–${g.score.a}</span>` : ''}
      <a class="btn ghost sm" href="boleta.html?id=${esc(g.id)}" target="_blank">Boleta</a>
      <button class="btn gold sm" data-act="open" data-id="${esc(g.id)}">${g.status === 'final' ? 'Reabrir' : 'Abrir'}</button></div></div>`;
  app.innerHTML = `<h1 class="page-title">Mesa de <b>anotación</b></h1>
    <h3 class="gold" style="font-size:22px;margin-top:18px">Elige el partido</h3>
    <div class="gm-list">${open.map(row).join('') || '<div class="empty">No hay partidos pendientes. Crea uno en Administración.</div>'}</div>
    ${fin.length ? `<h3 class="muted" style="font-size:20px;margin-top:24px">Finalizados</h3><div class="gm-list">${fin.map(row).join('')}</div>` : ''}`;
}

function control(S, g) {
  const R = S.config.rules;
  const h = UI.team(S, g.home), a = UI.team(S, g.away);
  const cur = side === 'h' ? h : a;
  const stats = T.playerStats(g.events.filter(e => e.team === side));
  const over = g.clock.period >= R.periods;
  const tied = g.score.h === g.score.a;
  const rem = T.remaining(g);
  const periodOver = rem <= 0 && !g.clock.running;
  const askKey = g.id + ':' + g.clock.period;
  if (rem > 0 || g.clock.running) endDismissed = null; // si el reloj vuelve a correr, se vuelve a preguntar al terminar
  const askEnd = g.status !== 'final' && over && periodOver && !tied && endDismissed !== askKey;
  const oc = T.onCourt(g), N = R.onCourt || 5;
  /* Color de camiseta de este partido (g.kit): se elige aquí antes de iniciar y lo usa Hoopz Live; si no se elige, vale el color del equipo */
  const KITS = [['#ffffff', 'Blanco'], ['#111111', 'Negro'], ['#d32f2f', 'Rojo'], ['#1565c0', 'Azul'], ['#2e7d32', 'Verde'], ['#fbc02d', 'Amarillo'], ['#ef6c00', 'Naranja'], ['#7b1fa2', 'Morado']];
  const kit = k => (g.kit && g.kit[k]) || '';
  const kitPick = (k, t) => `<div class="kp"><b>${k === 'h' ? 'Local' : 'Visita'}: ${esc(t.name)}</b>${KITS.map(([c, n]) => `<button class="sw ${kit(k).toLowerCase() === c ? 'on' : ''}" style="background:${c}" title="${n}" aria-label="${n}" data-act="kit" data-s="${k}" data-c="${c}"></button>`).join('')}<input type="color" data-kit="${k}" value="${esc(kit(k) || '#888888')}" title="Otro color"><button class="btn sm ghost" data-act="kit" data-s="${k}" data-c="" title="Usar el color del equipo">✕</button></div>`;
  const sameKit = kit('h') && kit('h').toLowerCase() === kit('a').toLowerCase();
  const kitRow = `<div class="kitrow"><span class="muted">Camiseta:</span>${kitPick('h', h)}${kitPick('a', a)}${sameKit ? '<span style="color:var(--live)">⚠ Los dos equipos tienen el mismo color</span>' : ''}</div>`;
  const teamBox = (k, t) => `<div class="m-team ${side === k ? 'on' : ''}" data-act="side" data-s="${k}"><small>${k === 'h' ? 'Local' : 'Visitante'}</small><h3>${kit(k) ? `<i class="kit" style="--k:${esc(kit(k))}"></i>` : ''}${esc(t.name)}</h3><div class="s">${g.score[k]}</div>
    <div class="meta">Faltas ${T.periodLabel(g.clock.period)}: <b>${T.teamFouls(g, k, g.clock.period)}</b>${T.teamFouls(g, k, g.clock.period) >= R.bonusFouls ? ' <span class="bonus">BONUS</span>' : ''} · TM: ${Math.max(0, R.timeouts - T.timeoutsUsed(g, k))}</div></div>`;

  let endBtn = '';
  if (g.status === 'final') endBtn = '<button class="btn ghost" data-act="reopen">Reabrir partido</button>';
  else if (!over) endBtn = `<button class="btn ghost" data-act="next">Siguiente período (${T.periodLabel(g.clock.period + 1)})</button>`;
  else if (tied) endBtn = `<button class="btn gold" data-act="next">Empate: iniciar prórroga (${T.periodLabel(g.clock.period + 1)} · ${T.otMinutes(g.cat)} min)</button>`;
  else endBtn = ''; // fin del partido sin empate: lo pregunta la propia mesa al terminar el tiempo (no hay botón grande que se toque sin querer)

  const players = cur.players.map(p => {
    const s = stats[p.id] || T.blank();
    return `<button class="pl ${sel === p.id ? 'on' : ''} ${s.pf >= R.foulsOut ? 'out' : (s.pf > 0 && s.pf === R.foulsOut - 1) ? 'warn' : ''} ${oc[side].has(p.id) ? 'oc' : ''}" data-act="pl" data-id="${esc(p.id)}"><b>${p.num}</b><span>${esc(p.name)}</span><i>${s.pts} pts · ${s.pf} F${s.pf >= R.foulsOut ? ' ✖' : ''}</i>${UI.capMark(p)}</button>`;
  }).join('');

  const selP = sel && cur.players.find(p => p.id === sel);
  const acts = Object.entries(ACTIONS).filter(([k, v]) => !v.team && !v.sub && v.lvl <= g.mode);
  const off = selP ? '' : 'disabled';
  const pad = `<div class="pad ${selP ? '' : 'idle'}"><h3>${selP ? `#${selP.num} ${esc(selP.name)} <span class="muted" style="font-size:16px">· ${esc(cur.name)}</span>` : 'Elige un jugador'}</h3>
      <div class="acts scores">${acts.filter(([, v]) => v.k === 'score').map(([k, v]) => `<button class="act score" data-act="ev" data-t="${k}" ${off}>${v.l}</button>`).join('')}</div>
      <div class="acts">${acts.filter(([, v]) => v.k !== 'score').map(([k, v]) => `<button class="act ${v.k}" data-act="ev" data-t="${k}" ${off}>${v.l}</button>`).join('')}</div>
      <div class="row" style="margin-top:10px">${selP ? '<button class="btn sm" data-act="clear">Cancelar selección</button>' : '<span class="muted" style="font-size:13px">Toca el número de un jugador y luego la jugada.</span>'}</div></div>`;

  const idx = T.playerIndex(S);
  const log = g.events.slice(-5).reverse().map(e => {
    const pl = e.pid && idx[e.pid];
    return `<li><span class="t">${T.periodLabel(e.p)} ${T.fmtClock(e.c)}</span>${UI.badge(UI.team(S, e.team === 'h' ? g.home : g.away))}<span>${esc(ACTIONS[e.type].name)}${pl ? ' — #' + pl.p.num + ' ' + esc(pl.p.name) : ''}</span>${ACTIONS[e.type].pts ? `<span class="pts">+${ACTIONS[e.type].pts}</span>` : ''}</li>`;
  }).join('');

  const cnt = oc[side].size;
  const modeBar = `<div class="row" style="justify-content:space-between;margin:10px 0 0"><span class="seg"><button data-act="mode" data-m="play" class="${subMode ? '' : 'on'}">Jugadas</button><button data-act="mode" data-m="subs" class="${subMode ? 'on' : ''}">Cambios</button></span>
    <span class="ocnt">En cancha: <b class="${cnt === N ? 'ok' : 'bad'}">${cnt}/${N}</b></span></div>`;
  const subCard = `<div class="subcard"><h3 class="gold" style="font-size:22px">Modo cambios</h3><p class="muted" style="font-size:14px;margin:6px 0 0">Toca un jugador para <b>meterlo</b> a la cancha o <b>sacarlo</b>. Los que están en cancha llevan el punto verde. Marca el quinteto inicial antes de iniciar el reloj.</p></div>`;
  const mm = Math.floor(rem / 60000), ss = Math.floor((rem % 60000) / 1000);
  app.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><button class="btn sm" data-act="back">← Partidos</button>
      <span class="muted" style="font-size:13px">${esc(UI.catName(S, g.cat))} · Captura ${T.MODES[g.mode]}</span>
      <span class="row"><span class="row" style="gap:4px" title="Tamaño de la mesa"><button class="btn sm ghost" data-act="zm" aria-label="Reducir">A−</button><button class="btn sm ${autoFit ? 'gold' : 'ghost'}" data-act="za">Auto${autoFit ? ' ' + Math.round(zoom * 100) + '%' : ''}</button><button class="btn sm ghost" data-act="zp" aria-label="Ampliar">A+</button></span>
      <a class="btn sm ghost" href="boleta.html?id=${esc(g.id)}" target="_blank">Boleta</a>
      <a class="btn sm ghost" href="partido.html?id=${esc(g.id)}" target="_blank">Ver como público</a></span></div>
    <div class="mhead">${teamBox('h', h)}
      <div class="clkbox"><div class="clk" data-gid="${esc(g.id)}">${UI.clockText(g)}</div>
        <div class="row"><button class="btn sm ${g.clock.running ? '' : 'gold'}" data-act="toggle" ${g.status === 'final' ? 'disabled' : ''}>${g.clock.running ? 'Pausar' : 'Iniciar'}</button>
        <button class="btn sm ghost" data-act="adjust">Ajustar</button></div>
      </div>${teamBox('a', a)}</div>
    ${adjusting ? `<div class="adj" style="justify-content:center;margin:8px 0"><select class="inp" id="ap" aria-label="Período">${Array.from({ length: Math.max(R.periods + 3, g.clock.period) }, (_, i) => `<option value="${i + 1}" ${i + 1 === g.clock.period ? 'selected' : ''}>${T.periodLabel(i + 1)}</option>`).join('')}</select> <input class="inp" id="am" type="number" min="0" value="${mm}"> : <input class="inp" id="as" type="number" min="0" max="59" value="${ss}"><button class="btn sm gold" data-act="setclock">Fijar</button></div>` : ''}
    ${periodOver && g.status !== 'final' ? '<div class="hint" style="margin:0 0 8px;border-color:var(--gold);color:var(--gold)">Fin del período.</div>' : ''}
    ${g.status === 'final' ? '' : kitRow}
    <div class="row" style="margin-bottom:10px">${endBtn}${T.isUnstarted(g) ? '<button class="btn sm ghost" data-act="unstart" title="Deja el partido como programado, sin iniciar">Volver a programado</button>' : ''}</div>
    <div class="row" style="justify-content:space-between"><h3 style="font-size:22px">${esc(cur.name)}</h3>
      <button class="btn sm" data-act="tmo" ${T.timeoutsUsed(g, side) >= R.timeouts || g.status === 'final' ? 'disabled' : ''}>Tiempo muerto</button></div>
    ${g.status === 'final' ? '' : modeBar}
    <div class="mwork"><div class="players">${players}</div>
    ${g.status === 'final' ? '' : subMode ? subCard : pad}${g.status === 'final' || selP || subMode ? '' : '<div class="hint">Toca el número del jugador y luego la jugada.</div>'}</div>
    <div class="log"><div class="row" style="justify-content:space-between"><h3>Últimas jugadas</h3><button class="btn sm danger" data-act="undo" ${g.events.length ? '' : 'disabled'}>Deshacer última</button></div>
      <ul class="plays">${log || '<li class="muted">Sin jugadas.</li>'}</ul></div>
    ${g.status !== 'final' ? `<div class="row" style="justify-content:center;margin:34px 0 60px;padding-top:18px;border-top:1px dashed var(--line)"><button class="btn sm ghost" data-act="finish" style="opacity:.75">Finalizar partido manualmente…</button></div>` : ''}
    ${askEnd ? `<div id="endask" style="position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.78);display:grid;place-items:center;padding:24px"><div class="card" style="max-width:520px;width:100%;text-align:center;padding:28px;border:1px solid var(--gold)"><h2 class="gold" style="font-size:30px;margin:0 0 6px">¿Finalizó el partido?</h2><p class="muted" style="margin:0 0 6px">Terminó el tiempo de ${T.periodLabel(g.clock.period)}.</p><p style="font-size:28px;font-weight:700;margin:6px 0 22px">${esc(h.name)} ${g.score.h} – ${g.score.a} ${esc(a.name)}</p><div class="row" style="justify-content:center;gap:40px"><button class="btn" data-act="endno" style="min-width:120px">No</button><button class="btn gold" data-act="endyes" style="min-width:120px">Sí</button></div></div></div>` : ''}`;
}

function render() {
  const S = T.state();
  const g = gid && T.game(gid);
  document.body.style.paddingBottom = '';
  document.body.classList.toggle('mesa-on', !!g);
  if (!g) { picker(S); applyZoom(); return; }
  control(S, g);
  applyZoom();
  const mh = document.querySelector('.mhead');
  if (mh) document.documentElement.style.setProperty('--mh', mh.offsetHeight + 'px');
  const padEl = document.querySelector('.pad');
  if (padEl && !padEl.classList.contains('idle') && getComputedStyle(padEl).position === 'fixed') {
    const padH = padEl.getBoundingClientRect().height; // alto visible (ya con el zoom aplicado)
    document.body.style.paddingBottom = (padH + 16) + 'px';
    const on = document.querySelector('.pl.on');
    if (on) { on.style.scrollMarginBottom = (padH + 12) + 'px'; on.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const S = T.state();
  const g = gid && T.game(gid);
  const m = fn => T.mutate(s => fn(s.games.find(x => x.id === gid), s));
  switch (b.dataset.act) {
    case 'open': gid = b.dataset.id; sel = null; side = 'h'; history.replaceState(null, '', '?id=' + gid); render(); break;
    case 'back': gid = null; sel = null; history.replaceState(null, '', 'mesa.html'); render(); break;
    case 'side': side = b.dataset.s; sel = null; render(); break;
    case 'zm': case 'zp':
      autoFit = false; store.set('torneo.mesaAuto', '0');
      zoom = Math.min(1.2, Math.max(0.6, Math.round((zoom + (b.dataset.act === 'zp' ? 0.05 : -0.05)) * 100) / 100));
      store.set('torneo.mesaZoom', zoom); render(); break;
    case 'za':
      autoFit = !autoFit; store.set('torneo.mesaAuto', autoFit ? '1' : '0');
      if (!autoFit) { zoom = 1; store.set('torneo.mesaZoom', 1); }
      render(); break;
    case 'mode': subMode = b.dataset.m === 'subs'; sel = null; render(); break;
    case 'pl': {
      if (!subMode) { sel = sel === b.dataset.id ? null : b.dataset.id; render(); break; }
      const pid = b.dataset.id, N = S.config.rules.onCourt || 5;
      const wasOn = T.onCourt(g)[side].has(pid);
      m(x => T.addEvent(x, { team: side, pid, type: wasOn ? 'SUB_OUT' : 'SUB_IN' }));
      const n = T.onCourt(T.game(gid))[side].size;
      if (!wasOn && n > N) UI.toast(`Hay ${n} jugadores en cancha (deberían ser ${N})`, 'bad');
      break;
    }
    case 'clear': sel = null; render(); break;
    case 'toggle': {
      if (!g.clock.running && (T.hasSubs(g) || !g.events.length)) {
        const oc2 = T.onCourt(g), N = S.config.rules.onCourt || 5;
        if (oc2.h.size !== N || oc2.a.size !== N) UI.toast(`Jugadores en cancha: local ${oc2.h.size}, visitante ${oc2.a.size} (deberían ser ${N}). Usa el modo Cambios.`, 'bad');
      }
      m(x => (x.clock.running ? T.pauseClock(x) : T.startClock(x))); break;
    }
    case 'kit': m(x => { x.kit = Object.assign({}, x.kit); if (b.dataset.c) x.kit[b.dataset.s] = b.dataset.c; else delete x.kit[b.dataset.s]; }); break;
    case 'adjust': adjusting = !adjusting; render(); break;
    case 'setclock': {
      const ms = (Math.max(0, +document.getElementById('am').value || 0) * 60 + Math.min(59, Math.max(0, +document.getElementById('as').value || 0))) * 1000;
      const per = Math.max(1, +document.getElementById('ap').value || g.clock.period);
      adjusting = false; m(x => { x.clock.period = per; T.setClock(x, ms); }); break;
    }
    case 'ev': {
      const type = b.dataset.t, pid = sel;
      m(x => T.addEvent(x, { team: side, pid, type }));
      const fresh = T.game(gid);
      if (type === 'FOUL') {
        const n = T.playerStats(fresh.events.filter(e2 => e2.team === side))[pid].pf;
        const p = T.playerIndex(T.state())[pid].p;
        if (n >= S.config.rules.foulsOut) UI.toast(`¡#${p.num} ${p.name} eliminado por faltas (${n})!`, 'bad');
        else UI.toast(`Falta #${p.num} (${n})`);
      } else UI.toast(ACTIONS[type].name + ' registrado');
      sel = null; render(); break;
    }
    case 'tmo': m(x => { T.addEvent(x, { team: side, pid: null, type: 'TMO' }); T.pauseClock(x); }); UI.toast('Tiempo muerto'); break;
    case 'undo': if (g.events.length) { m(x => T.undo(x)); UI.toast('Última jugada deshecha'); } break;
    case 'next': m(x => T.nextPeriod(x)); break;
    case 'endyes': m(x => T.finishGame(x)); break;
    case 'endno': endDismissed = g.id + ':' + g.clock.period; render(); break;
    case 'finish': {
      const timeUp = g.clock.period >= S.config.rules.periods && !g.clock.running && T.remaining(g) <= 0 && g.score.h !== g.score.a;
      const left = T.fmtClock(T.remaining(g));
      const msg = timeUp ? 'El tiempo terminó y no hay empate.\nMarcador final: ' + g.score.h + '–' + g.score.a + '\n\n¿Finalizamos el partido?'
        : '⚠ EL TIEMPO NO HA TERMINADO\n\nVa en ' + T.periodLabel(g.clock.period) + ' con ' + left + ' por jugar' + (g.clock.running ? ' (el reloj está corriendo)' : '') + '.\nMarcador: ' + g.score.h + '–' + g.score.a + '\n\n¿Seguro que desea FINALIZAR el partido?';
      if (confirm(msg)) { m(x => T.finishGame(x)); }
      break;
    }
    case 'reopen': m(x => { x.status = 'live'; }); break;
    case 'unstart':
      if (T.isUnstarted(g) && confirm('El partido aún no tiene jugadas. ¿Volver a dejarlo como programado (sin iniciar)?')) { m(x => T.resetToScheduled(x)); UI.toast('Partido de nuevo como programado'); }
      break;
  }
});

/* Otro color de camiseta (selector de color): se guarda al confirmar */
app.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.kit;
  if (!k || !gid) return;
  T.mutate(s => { const x = s.games.find(y => y.id === gid); if (x) x.kit = Object.assign({}, x.kit, { [k]: e.target.value }); });
});

UI.gate(app, start);
});
</script>
</body>
</html>
