<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa de anotación · Torneo interno Hoopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=56">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoopz">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<main><div class="wrap mesa"><div id="app"></div></div></main>
<script src="js/firebase-config.js?v=56"></script>
<script src="js/core.js?v=56"></script>
<script src="js/seed.js?v=56"></script>
<script src="js/ui.js?v=56"></script>
<script>
T.load().then(() => {
UI.layout('');
const { esc, ACTIONS } = T;
const app = document.getElementById('app');
let gid = new URLSearchParams(location.search).get('id');
let side = 'h', sel = null, adjusting = false, subMode = false;


function start() { render(); T.subscribe(render); setInterval(watchClock, 500); }

/* Pausa sola al llegar a 0:00 */
function watchClock() {
  const g = gid && T.game(gid);
  if (g && g.clock.running && T.remaining(g) <= 0) {
    T.mutate(s => T.pauseClock(s.games.find(x => x.id === gid)));
    UI.toast('Fin del período ' + T.periodLabel(g.clock.period));
  }
}

function picker(S) {
  const open = S.games.filter(g => g.status !== 'final').sort((a, b) => (a.status === 'live' ? 0 : 1) - (b.status === 'live' ? 0 : 1) || UI.byDate(a, b));
  const fin = S.games.filter(g => g.status === 'final').sort((a, b) => UI.byDate(b, a));
  const row = g => `<div class="gm"><div><b>${esc(UI.team(S, g.home).name)}</b> vs <b>${esc(UI.team(S, g.away).name)}</b>
      <div class="muted" style="font-size:13px">${esc(UI.catName(S, g.cat))} · ${UI.fmtDate(g.date)} ${UI.fmtTime(g.date)} · Captura ${T.MODES[g.mode]}</div></div>
      <div class="row">${g.status === 'live' ? '<span class="chip live"><i class="dot"></i>EN VIVO</span>' : ''}${g.status === 'final' ? `<span class="chip">${g.score.h}–${g.score.a}</span>` : ''}
      <button class="btn gold sm" data-act="open" data-id="${esc(g.id)}">${g.status === 'final' ? 'Reabrir' : 'Abrir'}</button></div></div>`;
  app.innerHTML = `<h1 class="page-title">Mesa de <b>anotación</b></h1>
    <h3 class="gold" style="font-size:22px;margin-top:18px">Elige el partido</h3>
    <div class="gm-list">${open.map(row).join('') || '<div class="empty">No hay partidos pendientes. Crea uno en Administración.</div>'}</div>
    ${fin.length ? `<h3 class="muted" style="font-size:20px;margin-top:24px">Finalizados</h3><div class="gm-list">${fin.map(row).join('')}</div>` : ''}`;
}

function control(S, g) {
  const R = S.config.rules;
  const h = UI.team(S, g.home), a = UI.team(S, g.away);
  const cur = side === 'h' ? h : a;
  const stats = T.playerStats(g.events.filter(e => e.team === side));
  const over = g.clock.period >= R.periods;
  const tied = g.score.h === g.score.a;
  const rem = T.remaining(g);
  const periodOver = rem <= 0 && !g.clock.running;
  const oc = T.onCourt(g), N = R.onCourt || 5;
  const teamBox = (k, t) => `<div class="m-team ${side === k ? 'on' : ''}" data-act="side" data-s="${k}"><small>${k === 'h' ? 'Local' : 'Visitante'}</small><h3>${esc(t.name)}</h3><div class="s">${g.score[k]}</div>
    <div class="meta">Faltas ${T.periodLabel(g.clock.period)}: <b>${T.teamFouls(g, k, g.clock.period)}</b>${T.teamFouls(g, k, g.clock.period) >= R.bonusFouls ? ' <span class="bonus">BONUS</span>' : ''} · TM: ${Math.max(0, R.timeouts - T.timeoutsUsed(g, k))}</div></div>`;

  let endBtn = '';
  if (g.status === 'final') endBtn = '<button class="btn ghost" data-act="reopen">Reabrir partido</button>';
  else if (!over) endBtn = `<button class="btn ghost" data-act="next">Siguiente período (${T.periodLabel(g.clock.period + 1)})</button>`;
  else if (tied) endBtn = `<button class="btn gold" data-act="next">Empate: iniciar prórroga (${T.periodLabel(g.clock.period + 1)} · ${R.otMinutes} min)</button>`;
  else endBtn = '<button class="btn gold" data-act="finish">Finalizar partido</button>';

  const players = cur.players.map(p => {
    const s = stats[p.id] || T.blank();
    return `<button class="pl ${sel === p.id ? 'on' : ''} ${s.pf >= R.foulsOut ? 'out' : (s.pf > 0 && s.pf === R.foulsOut - 1) ? 'warn' : ''} ${oc[side].has(p.id) ? 'oc' : ''}" data-act="pl" data-id="${esc(p.id)}"><b>${p.num}</b><span>${esc(p.name)}</span><i>${s.pts} pts · ${s.pf} F${s.pf >= R.foulsOut ? ' ✖' : ''}</i>${UI.capMark(p)}</button>`;
  }).join('');

  const selP = sel && cur.players.find(p => p.id === sel);
  const acts = Object.entries(ACTIONS).filter(([k, v]) => !v.team && !v.sub && v.lvl <= g.mode);
  const off = selP ? '' : 'disabled';
  const pad = `<div class="pad ${selP ? '' : 'idle'}"><h3>${selP ? `#${selP.num} ${esc(selP.name)} <span class="muted" style="font-size:16px">· ${esc(cur.name)}</span>` : 'Elige un jugador'}</h3>
      <div class="acts scores">${acts.filter(([, v]) => v.k === 'score').map(([k, v]) => `<button class="act score" data-act="ev" data-t="${k}" ${off}>${v.l}</button>`).join('')}</div>
      <div class="acts">${acts.filter(([, v]) => v.k !== 'score').map(([k, v]) => `<button class="act ${v.k}" data-act="ev" data-t="${k}" ${off}>${v.l}</button>`).join('')}</div>
      <div class="row" style="margin-top:10px">${selP ? '<button class="btn sm" data-act="clear">Cancelar selección</button>' : '<span class="muted" style="font-size:13px">Toca el número de un jugador y luego la jugada.</span>'}</div></div>`;

  const idx = T.playerIndex(S);
  const log = g.events.slice(-8).reverse().map(e => {
    const pl = e.pid && idx[e.pid];
    return `<li><span class="t">${T.periodLabel(e.p)} ${T.fmtClock(e.c)}</span>${UI.badge(UI.team(S, e.team === 'h' ? g.home : g.away))}<span>${esc(ACTIONS[e.type].name)}${pl ? ' — #' + pl.p.num + ' ' + esc(pl.p.name) : ''}</span>${ACTIONS[e.type].pts ? `<span class="pts">+${ACTIONS[e.type].pts}</span>` : ''}</li>`;
  }).join('');

  const cnt = oc[side].size;
  const modeBar = `<div class="row" style="justify-content:space-between;margin:10px 0 0"><span class="seg"><button data-act="mode" data-m="play" class="${subMode ? '' : 'on'}">Jugadas</button><button data-act="mode" data-m="subs" class="${subMode ? 'on' : ''}">Cambios</button></span>
    <span class="ocnt">En cancha: <b class="${cnt === N ? 'ok' : 'bad'}">${cnt}/${N}</b></span></div>`;
  const subCard = `<div class="subcard"><h3 class="gold" style="font-size:22px">Modo cambios</h3><p class="muted" style="font-size:14px;margin:6px 0 0">Toca un jugador para <b>meterlo</b> a la cancha o <b>sacarlo</b>. Los que están en cancha llevan el punto verde. Marca el quinteto inicial antes de iniciar el reloj.</p></div>`;
  const mm = Math.floor(rem / 60000), ss = Math.floor((rem % 60000) / 1000);
  app.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><button class="btn sm" data-act="back">← Partidos</button>
      <span class="muted" style="font-size:13px">${esc(UI.catName(S, g.cat))} · Captura ${T.MODES[g.mode]}</span>
      <a class="btn sm ghost" href="partido.html?id=${esc(g.id)}" target="_blank">Ver como público</a></div>
    <div class="mhead">${teamBox('h', h)}
      <div class="clkbox"><div class="clk" data-gid="${esc(g.id)}">${UI.clockText(g)}</div>
        <div class="row"><button class="btn sm ${g.clock.running ? '' : 'gold'}" data-act="toggle" ${g.status === 'final' ? 'disabled' : ''}>${g.clock.running ? 'Pausar' : 'Iniciar'}</button>
        <button class="btn sm ghost" data-act="adjust">Ajustar</button></div>
      </div>${teamBox('a', a)}</div>
    ${adjusting ? `<div class="adj" style="justify-content:center;margin:8px 0"><input class="inp" id="am" type="number" min="0" value="${mm}"> : <input class="inp" id="as" type="number" min="0" max="59" value="${ss}"><button class="btn sm gold" data-act="setclock">Fijar</button></div>` : ''}
    ${periodOver && g.status !== 'final' ? '<div class="hint" style="margin:0 0 8px;border-color:var(--gold);color:var(--gold)">Fin del período.</div>' : ''}
    <div class="row" style="margin-bottom:10px">${endBtn}${g.status !== 'final' && !(over && !tied) ? '<button class="btn sm danger" data-act="finish">Finalizar ya</button>' : ''}</div>
    <div class="row" style="justify-content:space-between"><h3 style="font-size:22px">${esc(cur.name)}</h3>
      <button class="btn sm" data-act="tmo" ${T.timeoutsUsed(g, side) >= R.timeouts ? 'disabled' : ''}>Tiempo muerto</button></div>
    ${g.status === 'final' ? '' : modeBar}
    <div class="mwork"><div class="players">${players}</div>
    ${g.status === 'final' ? '' : subMode ? subCard : pad}${g.status === 'final' || selP || subMode ? '' : '<div class="hint">Toca el número del jugador y luego la jugada.</div>'}</div>
    <div class="log"><div class="row" style="justify-content:space-between"><h3>Últimas jugadas</h3><button class="btn sm danger" data-act="undo" ${g.events.length ? '' : 'disabled'}>Deshacer última</button></div>
      <ul class="plays">${log || '<li class="muted">Sin jugadas.</li>'}</ul></div>`;
}

function render() {
  const S = T.state();
  const g = gid && T.game(gid);
  document.body.style.paddingBottom = '';
  document.body.classList.toggle('mesa-on', !!g);
  if (!g) return picker(S);
  control(S, g);
  const mh = document.querySelector('.mhead');
  if (mh) document.documentElement.style.setProperty('--mh', mh.offsetHeight + 'px');
  const padEl = document.querySelector('.pad');
  if (padEl && !padEl.classList.contains('idle') && getComputedStyle(padEl).position === 'fixed') {
    document.body.style.paddingBottom = (padEl.offsetHeight + 16) + 'px';
    const on = document.querySelector('.pl.on');
    if (on) { on.style.scrollMarginBottom = (padEl.offsetHeight + 12) + 'px'; on.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const S = T.state();
  const g = gid && T.game(gid);
  const m = fn => T.mutate(s => fn(s.games.find(x => x.id === gid), s));
  switch (b.dataset.act) {
    case 'open': gid = b.dataset.id; sel = null; side = 'h'; history.replaceState(null, '', '?id=' + gid); render(); break;
    case 'back': gid = null; sel = null; history.replaceState(null, '', 'mesa.html'); render(); break;
    case 'side': side = b.dataset.s; sel = null; render(); break;
    case 'mode': subMode = b.dataset.m === 'subs'; sel = null; render(); break;
    case 'pl': {
      if (!subMode) { sel = sel === b.dataset.id ? null : b.dataset.id; render(); break; }
      const pid = b.dataset.id, N = S.config.rules.onCourt || 5;
      const wasOn = T.onCourt(g)[side].has(pid);
      m(x => T.addEvent(x, { team: side, pid, type: wasOn ? 'SUB_OUT' : 'SUB_IN' }));
      const n = T.onCourt(T.game(gid))[side].size;
      if (!wasOn && n > N) UI.toast(`Hay ${n} jugadores en cancha (deberían ser ${N})`, 'bad');
      break;
    }
    case 'clear': sel = null; render(); break;
    case 'toggle': {
      if (!g.clock.running && (T.hasSubs(g) || !g.events.length)) {
        const oc2 = T.onCourt(g), N = S.config.rules.onCourt || 5;
        if (oc2.h.size !== N || oc2.a.size !== N) UI.toast(`Jugadores en cancha: local ${oc2.h.size}, visitante ${oc2.a.size} (deberían ser ${N}). Usa el modo Cambios.`, 'bad');
      }
      m(x => (x.clock.running ? T.pauseClock(x) : T.startClock(x))); break;
    }
    case 'adjust': adjusting = !adjusting; render(); break;
    case 'setclock': {
      const ms = (Math.max(0, +document.getElementById('am').value || 0) * 60 + Math.min(59, Math.max(0, +document.getElementById('as').value || 0))) * 1000;
      adjusting = false; m(x => T.setClock(x, ms)); break;
    }
    case 'ev': {
      const type = b.dataset.t, pid = sel;
      m(x => T.addEvent(x, { team: side, pid, type }));
      const fresh = T.game(gid);
      if (type === 'FOUL') {
        const n = T.playerStats(fresh.events.filter(e2 => e2.team === side))[pid].pf;
        const p = T.playerIndex(T.state())[pid].p;
        if (n >= S.config.rules.foulsOut) UI.toast(`¡#${p.num} ${p.name} eliminado por faltas (${n})!`, 'bad');
        else UI.toast(`Falta #${p.num} (${n})`);
      } else UI.toast(ACTIONS[type].name + ' registrado');
      sel = null; render(); break;
    }
    case 'tmo': m(x => { T.addEvent(x, { team: side, pid: null, type: 'TMO' }); T.pauseClock(x); }); UI.toast('Tiempo muerto'); break;
    case 'undo': if (g.events.length) { m(x => T.undo(x)); UI.toast('Última jugada deshecha'); } break;
    case 'next': m(x => T.nextPeriod(x)); break;
    case 'finish':
      if (confirm('¿Finalizar el partido con el marcador ' + g.score.h + '–' + g.score.a + '?')) { m(x => T.finishGame(x)); }
      break;
    case 'reopen': m(x => { x.status = 'live'; }); break;
  }
});

UI.gate(app, start);
});
</script>
</body>
</html>
