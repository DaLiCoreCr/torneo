<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podio · Torneo interno Hoopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=53">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoopz">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  .pd-start { margin: 22px 0 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  .pd-start .btn { font-size: 22px; padding: 14px 28px; }
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: clamp(8px, 2.2vw, 28px); margin: 34px auto 10px; max-width: 1100px; }
  .pd { flex: 1 1 0; min-width: 0; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .pd .who { min-height: 0; margin-bottom: 12px; opacity: 0; transform: translateY(30px) scale(.85); transition: opacity .7s, transform .7s cubic-bezier(.2, 1.3, .4, 1); }
  .pd.on .who { opacity: 1; transform: none; }
  .pd .badge { width: clamp(70px, 15vw, 190px); height: clamp(70px, 15vw, 190px); font-size: clamp(26px, 5vw, 64px); margin: 0 auto 10px; }
  .pd.first .badge { width: clamp(90px, 19vw, 240px); height: clamp(90px, 19vw, 240px); font-size: clamp(32px, 6vw, 80px); box-shadow: 0 0 40px rgba(201, 168, 76, .55); }
  .pd .nm { font: 400 clamp(22px, 4vw, 54px)/1 'Bebas Neue', sans-serif; letter-spacing: .03em; word-break: break-word; }
  .pd.first .nm { font-size: clamp(28px, 5.2vw, 72px); color: var(--gold); }
  .pd .sub { color: var(--muted); font-size: clamp(12px, 1.6vw, 18px); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
  .pd .blk { width: 100%; display: grid; place-items: start center; padding-top: 10px; border-radius: 12px 12px 0 0; font: 400 clamp(44px, 9vw, 120px)/1 'Bebas Neue', sans-serif; color: rgba(0, 0, 0, .55); border: 1px solid rgba(255, 255, 255, .15); border-bottom: 0; }
  .pd.first .blk { height: clamp(150px, 26vw, 300px); background: linear-gradient(180deg, #e8c96a, #a88730); }
  .pd.second .blk { height: clamp(110px, 19vw, 220px); background: linear-gradient(180deg, #dfe3e8, #8d949c); }
  .pd.third .blk { height: clamp(80px, 14vw, 160px); background: linear-gradient(180deg, #d9a066, #8a5a2c); }
  .pd .blk.empty-blk { filter: grayscale(.6) brightness(.55); }
  .pd .q { font: 400 clamp(40px, 8vw, 110px)/1 'Bebas Neue', sans-serif; color: var(--muted); margin-bottom: 8px; }
  .pd-note { text-align: center; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .pd-champ { text-align: center; font: 400 clamp(24px, 4vw, 52px)/1 'Bebas Neue', sans-serif; color: var(--gold); letter-spacing: .06em; margin-top: 8px; }
</style>
</head>
<body>
<main><div class="wrap pres"><div id="app"></div></div></main>
<div class="reveal" id="reveal"></div>
<script src="js/firebase-config.js?v=53"></script>
<script src="js/core.js?v=53"></script>
<script src="js/seed.js?v=53"></script>
<script src="js/ui.js?v=53"></script>
<script>
/* Podio por categoría: campeón, subcampeón y tercer lugar con escudo y nombre. Todo se calcula con los resultados guardados; no escribe nada. */
T.load({ live: false }).then(() => {
UI.layout('');
document.body.classList.add('tv');
const { esc } = T;
const app = document.getElementById('app');
const reveal = document.getElementById('reveal');
const ids = T.state().config.categories.map(c => c.id);
let cat = new URLSearchParams(location.search).get('cat');
if (!ids.includes(cat)) cat = UI.getCat(false);
const demo = new URLSearchParams(location.search).get('demo') === '1'; // muestra con datos de ejemplo (equipos reales de la categoría)
let running = false, token = 0, shownAll = {};
const ROLL_MS = 2400, SHOW_MS = 3800;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function burst(n) {
  const reach = Math.min(innerWidth, innerHeight) * 0.5;
  return Array.from({ length: n || 36 }, (_, i) => {
    const a = Math.random() * Math.PI * 2, r = 110 + Math.random() * reach;
    return `<i style="--x:${(Math.cos(a) * r * 1.5).toFixed(0)}px;--y:${(Math.sin(a) * r).toFixed(0)}px;--s:${(14 + Math.random() * 34).toFixed(0)}px;--d:${(Math.random() * 0.6).toFixed(2)}s;--r:${(Math.random() * 360).toFixed(0)}deg">${['★', '✦', '✧'][i % 3]}</i>`;
  }).join('');
}
function show(html) { reveal.innerHTML = html; reveal.classList.remove('show', 'out', 'group'); void reveal.offsetWidth; reveal.classList.add('show'); }
function hide() { reveal.classList.add('out'); return sleep(450).then(() => reveal.classList.remove('show', 'out')); }

/* Campeón, subcampeón y tercero. Tercero: ganador del partido por el 3.er lugar; si no hay ese partido, el mejor de la tabla entre los dos equipos que no pasaron a la final. */
function podium(S) {
  if (demo) {
    const ts = S.teams.filter(t => t.cat === cat);
    const sample = n => ts[n] || { id: 'demo' + n, name: ['Team Campeón', 'Team Subcampeón', 'Team Tercero'][n], color: ['#c9a84c', '#9aa3ad', '#c27a3a'][n], players: [] };
    return { champ: sample(0), runner: sample(1), bronze: sample(2), finalScore: 'Final 52 – 48', note: 'Muestra con datos de ejemplo: los reales aparecen al terminar la final', has: true };
  }
  const team = id => S.teams.find(t => t.id === id) || null;
  const g = st => S.games.filter(x => x.cat === cat && x.stage === st).sort((a, b) => a.slot - b.slot);
  const fin = g('final')[0], third = g('third')[0], sf = g('sf');
  const res = { champ: null, runner: null, bronze: null, finalScore: '', note: '', has: !!fin };
  if (fin && fin.status === 'final' && T.gameWinner(fin)) {
    res.champ = team(T.gameWinner(fin)); res.runner = team(T.gameLoser(fin));
    res.finalScore = 'Final ' + fin.score.h + ' – ' + fin.score.a;
  }
  if (third) {
    if (third.status === 'final' && T.gameWinner(third)) { res.bronze = team(T.gameWinner(third)); res.note = 'Ganó el partido por el tercer lugar'; }
    else res.note = 'Falta jugar el partido por el tercer lugar';
  } else if (sf.length === 2 && sf.every(x => x.status === 'final' && T.gameWinner(x))) {
    const order = T.standings(S, cat).map(r => r.team.id);
    const losers = sf.map(x => T.gameLoser(x)).sort((a, b) => order.indexOf(a) - order.indexOf(b));
    res.bronze = team(losers[0]); res.note = 'Mejor posición en la tabla entre los dos equipos que no pasaron a la final';
  }
  return res;
}

const slotHtml = (cls, label, t, num, on, sub) => `<div class="pd ${cls} ${on ? 'on' : ''}" id="pd-${cls}">
  <div class="who">${t && on ? UI.badge(t) : '<div class="q">?</div>'}<div class="nm">${t && on ? esc(t.name) : label}</div>${t && on && sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>
  <div class="blk ${t ? '' : 'empty-blk'}">${num}</div></div>`;

function podiumHtml(p, on) {
  return `<div class="podium">
    ${slotHtml('second', 'Subcampeón', p.runner, 2, on.second, 'Subcampeón')}
    ${slotHtml('first', 'Campeón', p.champ, 1, on.first, p.finalScore)}
    ${slotHtml('third', 'Tercer lugar', p.bronze, 3, on.third, 'Tercer lugar')}</div>
    ${on.first && p.champ ? `<div class="pd-champ">🏆 ¡${esc(p.champ.name)} es el campeón!</div>` : ''}
    ${on.third && p.note ? `<p class="pd-note">${esc(p.note)}</p>` : ''}`;
}

function render() {
  if (running) return;
  const S = T.state(), p = podium(S);
  const catName = UI.catName(S, cat);
  const head = `<div class="pres-h"><h1>Podio<br><b>${esc(catName)}</b></h1>
    <div class="row">${S.config.categories.length > 1 ? `<div class="pills" style="margin:0">${S.config.categories.map(c => `<button class="pill ${c.id === cat ? 'on' : ''}" data-cat="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div>` : ''}
      ${demo ? `<a class="btn sm ghost" href="podio.html?cat=${esc(cat)}">Ver podio real</a>` : `<a class="btn sm ghost" href="podio.html?demo=1&cat=${esc(cat)}">Ver muestra</a>`}<a class="btn sm ghost" href="llaves.html">← Llaves</a><button class="btn sm ghost" id="fs">${document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa'}</button></div></div>`;
  const banner = demo ? '<div class="chip soft" style="display:inline-block;margin-top:10px;font-size:14px;padding:6px 12px">MUESTRA · datos de ejemplo (equipos de la categoría)</div>' : '';
  if (!p.champ) {
    app.innerHTML = head + `<div class="empty" style="margin-top:20px">${p.has ? 'La final aún no termina.' : 'Todavía no hay final.'} El podio estará disponible cuando se juegue la final${p.note ? ' (' + esc(p.note.toLowerCase()) + ')' : ''}.</div>`;
    return;
  }
  const all = shownAll[cat];
  app.innerHTML = head + banner + `<div class="pd-start"><button class="btn gold" id="go">${all ? '↺ Repetir revelación' : '▶ Revelar podio'}</button>${all ? '' : '<button class="btn ghost" id="all">Mostrar el podio completo</button>'}</div>
    <div id="stage">${podiumHtml(p, { first: !!all, second: !!all, third: !!all })}</div>`;
  UI.fitTV();
}

async function run() {
  if (running) return;
  const S = T.reload() || T.state(), p = podium(S);
  if (!p.champ) return;
  running = true; const my = ++token;
  const names = S.teams.filter(t => t.cat === cat).map(t => t.name);
  const stage = document.getElementById('stage');
  document.getElementById('go').disabled = true;
  const on = { first: false, second: false, third: false };
  stage.innerHTML = podiumHtml(p, on);
  await sleep(600);
  const steps = [['third', p.bronze, 'Tercer lugar', '🥉'], ['second', p.runner, 'Subcampeón', '🥈'], ['first', p.champ, '¡Campeón!', '🏆']];
  for (const [k, t, label, icon] of steps) {
    if (my !== token) break;
    if (!t) { on[k] = true; stage.innerHTML = podiumHtml(p, on); continue; }
    show(`<div class="rv"><small>${icon} ${label}</small><div class="who" id="rn">· · ·</div></div>`);
    const iv = setInterval(() => { const el = document.getElementById('rn'); if (el) el.textContent = names[Math.floor(Math.random() * names.length)]; }, 80);
    await sleep(k === 'first' ? ROLL_MS + 900 : ROLL_MS); clearInterval(iv);
    show(`<div class="rv"><div class="burst">${burst(k === 'first' ? 64 : 36)}</div>${UI.badge(t)}<small>${icon} ${label}</small><div class="who">${esc(t.name)}</div></div>`);
    await sleep(k === 'first' ? SHOW_MS + 1500 : SHOW_MS);
    await hide();
    on[k] = true; stage.innerHTML = podiumHtml(p, on);
    await sleep(500);
  }
  shownAll[cat] = true; running = false; render();
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-cat]');
  if (b && !running) { cat = b.dataset.cat; history.replaceState(null, '', '?' + (demo ? 'demo=1&' : '') + 'cat=' + cat); render(); }
  if (e.target.id === 'go') run();
  if (e.target.id === 'all') { shownAll[cat] = true; render(); }
  if (e.target.id === 'fs') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
});
document.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !running && document.getElementById('go') && e.target.tagName !== 'BUTTON') { e.preventDefault(); run(); } });
document.addEventListener('fullscreenchange', () => render());
render();
UI.autoRefresh(render);
});
</script>
</body>
</html>
