<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteo de equipos · Torneo interno Hoopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=38">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoopz">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<main><div class="wrap page"><div id="app"></div></div></main>
<script src="js/firebase-config.js?v=38"></script>
<script src="js/core.js?v=38"></script>
<script src="js/seed.js?v=38"></script>
<script src="js/ui.js?v=38"></script>
<script>
T.load().then(() => {
UI.layout('');
const { esc } = T;
const app = document.getElementById('app');
let cat = UI.getCat(false), sel = null, query = '';
let capTeam = null, drawTeam = null;
const capSel = new Set(), parSel = new Set();
let capCoach = false;
let fromOpen = false, fromQ = '';

function start() { render(); T.subscribe(render); }

function render() {
  const S = T.state();
  const teams = S.teams.filter(t => t.cat === cat);
  const d = T.draft(S, cat);
  const q = query.trim().toLowerCase();
  const pool = d.pool.filter(p => !q || p.name.toLowerCase().includes(q));
  const placed = teams.reduce((n, t) => n + t.players.length, 0);
  if (sel && !d.pool.some(p => p.id === sel)) sel = null;
  const active = document.activeElement && document.activeElement.id === 'q';
  const activeFrom = document.activeElement && document.activeElement.id === 'from-q';

  const done = teams.filter(t => T.isTeamDone(d, t)).map(t => t.id);
  const caps = d.pool.filter(p => p.captain);
  [...capSel].forEach(id => { if (!caps.some(p => p.id === id)) capSel.delete(id); });
  const freeTeams = teams.filter(t => !T.capCount(t));
  const parents = d.parents || [];
  [...parSel].forEach(id => { if (!parents.some(p => p.id === id)) parSel.delete(id); });
  const parFree = teams.filter(t => !(d.parentsDone || []).includes(t.id)).length;
  const per = T.capsPer(S), noCap = teams.filter(t => T.capCount(t) < per), needCaps = noCap.reduce((n, t) => n + per - T.capCount(t), 0);
  const eligible = d.pool.filter(p => !p.captain);
  const left = teams.filter(t => !done.includes(t.id));
  if (!noCap.some(t => t.id === capTeam)) capTeam = null;
  if (!teams.some(t => t.id === drawTeam)) drawTeam = null;
  const cTeam = capTeam || (noCap[0] || {}).id;
  const dTeam = drawTeam || (left[0] || teams[0] || {}).id;
  const step1Done = !caps.length && !noCap.length;
  const capWarn = caps.length && caps.length !== needCaps
    ? `<p class="note" style="color:var(--live)">Hay <b>${caps.length}</b> capitanes marcados y se necesitan <b>${needCaps}</b> (${per} por equipo). Marca o desmarca la <b>C</b> en la lista.</p>` : '';
  const stat = t => t.players.length;
  const keyOf = n => n.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').split(/\s+/).slice(0, 2).join(' ');
  const seenIn = {}, dupes = new Set();
  S.config.categories.forEach(c => {
    const names = T.draft(S, c.id).pool.map(p => p.name).concat(S.teams.filter(t => t.cat === c.id).flatMap(t => t.players.map(p => p.name)));
    new Set(names.map(keyOf)).forEach(k => { if (seenIn[k] && seenIn[k] !== c.id) dupes.add(k); seenIn[k] = seenIn[k] || c.id; });
  });
  const dupWarn = dupes.size ? `<div class="card" style="margin-bottom:16px;border-color:var(--live)"><b style="color:var(--live)">⚠ Posibles jugadores repetidos entre categorías:</b> ${[...dupes].map(esc).join(', ')}. Revisa que cada jugador esté en una sola categoría (Administración → Jugadores y sorteo).</div>` : '';
  const stepHead = (n, title, ok) => `<h3 class="gold" style="font-size:24px">${ok ? '✅' : '🎲'} Paso ${n} · ${title}</h3>`;

  const capPanel = `<div class="card" style="margin-bottom:16px">${stepHead(1, 'Sorteo de capitanes', step1Done)}
    <div class="frm" style="margin-top:10px">
      <div><label class="lbl">Equipo que recibe sus capitanes</label><select class="inp" id="cap-team">${teams.map(t => `<option value="${esc(t.id)}" ${t.id === cTeam ? 'selected' : ''}>${esc(t.name)}${T.capCount(t) >= per ? ' ✓' : ''}</option>`).join('')}</select></div>
      <button class="btn gold" data-act="drawcap" ${caps.length && noCap.length ? '' : 'disabled'}>Sortear capitanes</button></div>
    ${caps.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0"><span class="muted" style="font-size:13px;align-self:center">Capitanes marcados (toca el nombre para elegirlo; ✕ lo desmarca):</span>${caps.map(p => `<span class="chip ${capSel.has(p.id) ? '' : 'soft'}" style="display:inline-flex;gap:8px;align-items:center;font-size:13px;padding:5px 9px;cursor:pointer;${capSel.has(p.id) ? 'background:var(--gold);color:#000' : ''}"><a href="#" data-act="capsel" data-id="${esc(p.id)}" style="color:inherit">★ ${esc(p.name)}</a> <a href="#" data-act="cap" data-id="${esc(p.id)}" style="color:inherit" title="Desmarcar">✕</a></span>`).join('')}</div>
    <div class="row" style="margin-bottom:6px"><button class="btn" data-act="drawcapgroup" ${capSel.size && freeTeams.length ? '' : 'disabled'}>Sortear equipo para los ${capSel.size} elegidos</button>
      <label class="chk"><input type="checkbox" id="cap-coach" ${capCoach ? 'checked' : ''}> También quedan como coaches del equipo</label></div>
    <p class="note" style="margin-top:0">Elige los capitanes que van juntos (por ejemplo 3) y el sistema les sortea un equipo que aún no tenga capitanes (${freeTeams.length} disponibles). Repite con el siguiente grupo hasta terminar.</p>` : ''}
    ${capWarn}<p class="note">Capitanes marcados sin equipo: <b>${caps.length}</b> · Se necesitan: <b>${needCaps}</b> (${per} por equipo, se cambia en Administración → Reglas). Cada capitán queda en un solo equipo. ✓ = equipo completo.</p></div>`;
  const drawPanel = `<div class="card" style="margin-bottom:16px">${stepHead(2, 'Sorteo de jugadores', !eligible.length && !caps.length && placed > 0)}
    <div class="frm" style="margin-top:10px">
      <div><label class="lbl">Equipo a formar</label><select class="inp" id="draw-team">${teams.map(t => `<option value="${esc(t.id)}" ${t.id === dTeam ? 'selected' : ''}>${esc(t.name)}${done.includes(t.id) ? ' ✓' : ''}</option>`).join('')}</select></div>
      <button class="btn gold" data-act="drawteam" ${eligible.length && !caps.length ? '' : 'disabled'}>Sortear equipo</button></div>
    <p class="note">${caps.length ? '<b>Primero termina el sorteo de capitanes</b> (paso 1). ' : ''}Participan <b>${eligible.length}</b> jugadores. El sistema reparte parejo la cantidad total y el género entre los equipos que faltan, contando a los capitanes. ✓ = equipo ya sorteado.</p></div>`;

  const others = S.config.categories.filter(c => c.id !== cat);
  const taken = new Set(parents.map(p => p.name.toLowerCase()).concat(teams.flatMap(t => T.coachList(t).map(c => c.toLowerCase()))));
  const fromNames = [...new Set(others.flatMap(c => T.draft(S, c.id).pool.map(p => p.name).concat(S.teams.filter(t => t.cat === c.id).flatMap(t => t.players.map(p => p.name)))))]
    .filter(n => !taken.has(n.toLowerCase()) && (!fromQ.trim() || n.toLowerCase().includes(fromQ.trim().toLowerCase()))).sort((x, y) => x.localeCompare(y));
  const fromLabel = others.map(c => c.name).join(' / ');
  const parPanel = `<div class="card" style="margin-bottom:16px"><h3 class="gold" style="font-size:24px">${parents.length ? '🎲' : '➕'} Paso 3 · Coaches de ${esc(UI.catName(S, cat))} (opcional)</h3>
    <p class="note" style="margin-top:6px">Los coaches pueden ser <b>jugadores mayores</b> (de ${esc(fromLabel || 'otra categoría')}) o <b>padres</b>. Arma grupos de los que van juntos y sortea a qué equipo de <b>${esc(UI.catName(S, cat))}</b> le toca el grupo.</p>
    <div class="row" style="margin:8px 0">${others.length ? `<button class="btn" data-act="fromtoggle">${fromOpen ? 'Cerrar lista' : 'Elegir de los jugadores de ' + esc(fromLabel)}</button>` : ''}</div>
    ${fromOpen ? `<div class="card" style="margin-bottom:10px"><input class="inp" id="from-q" placeholder="Buscar jugador…" value="${esc(fromQ)}"><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;max-height:240px;overflow:auto">${fromNames.map(n => `<a href="#" class="chip soft" data-act="addfrom" data-name="${esc(n)}" style="font-size:13px;padding:5px 9px;color:inherit">+ ${esc(n)}</a>`).join('') || '<span class="muted" style="font-size:13px">Sin resultados.</span>'}</div></div>` : ''}
    <textarea class="inp" id="par-text" rows="2" placeholder="O pega nombres (padres u otros): uno por línea" style="margin-top:6px"></textarea>
    <div class="row" style="margin:8px 0"><button class="btn" data-act="addparents">Agregar a la lista</button></div>
    ${parents.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0"><span class="muted" style="font-size:13px;align-self:center">Toca el nombre para elegirlo (✕ lo quita de la lista):</span>${parents.map(p => `<span class="chip ${parSel.has(p.id) ? '' : 'soft'}" style="display:inline-flex;gap:8px;align-items:center;font-size:13px;padding:5px 9px;${parSel.has(p.id) ? 'background:var(--gold);color:#000' : ''}"><a href="#" data-act="parsel" data-id="${esc(p.id)}" style="color:inherit">${esc(p.name)}</a> <a href="#" data-act="delparent" data-id="${esc(p.id)}" style="color:inherit" title="Quitar">✕</a></span>`).join('')}</div>
    <div class="row"><button class="btn gold" data-act="drawparents">${parSel.size ? `Sortear equipo para los ${parSel.size} elegidos` : parents.length === 1 ? 'Sortear equipo para ' + esc(parents[0].name) : `Sortear equipo para los ${parents.length} de la lista`}</button></div>
    <p class="note">Puedes sortear aunque la lista esté incompleta, con uno o varios: si no eliges a nadie, se sortea el equipo para todos los de la lista; si tocas nombres, solo para esos. Los elegidos quedan como <b>coaches</b> del equipo sorteado (los jugadores mayores siguen jugando en su categoría). Equipos que aún no reciben coaches: <b>${parFree}</b>. Si ya todos recibieron un grupo, el siguiente puede ir a cualquiera.</p>` : ''}</div>`;

  app.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:flex-end;gap:12px">
      <h1 class="page-title">Sorteo de <b>equipos</b></h1>
      <div class="row"><a class="btn ghost" href="presentacion.html?cat=${esc(cat)}" target="_blank">Abrir presentación ↗</a>
        <button class="btn" data-act="undo" ${(d.last || d.group) ? '' : 'disabled'}>Deshacer última</button>
        <button class="btn danger" data-act="resetplayers" title="Devuelve a la lista a los jugadores; los capitanes se quedan en su equipo">Reiniciar jugadores</button>
        <button class="btn danger" data-act="resetall" title="Devuelve a la lista a todos, capitanes incluidos">Reiniciar todo el sorteo</button></div></div>
    <div class="pills">${S.config.categories.map(c => `<button class="pill ${c.id === cat ? 'on' : ''}" data-act="cat" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div>
    <p class="note">Orden: <b>1)</b> marca con la <b>C</b> a los capitanes, <b>2)</b> sortea los capitanes, <b>3)</b> sortea los jugadores. Para corregir a mano, toca un jugador y luego el equipo (o arrástralo). La presentación se actualiza sola.</p>
    ${!teams.length ? `<div class="empty">No hay equipos en esta categoría. Créalos en <a class="gold" href="admin.html">Administración</a> (nombre y logo) y vuelve aquí.</div>` : `
    ${dupWarn}${capPanel}${drawPanel}${parPanel}
    <div class="draft">
      <div class="card">
        <div class="row" style="justify-content:space-between"><h3 class="gold" style="font-size:24px">Sin equipo (${d.pool.length})</h3></div>
        <input class="inp" id="q" placeholder="Buscar jugador…" value="${esc(query)}" style="margin-top:10px">
        <div class="dp-list">${pool.map(p => `<div class="dp ${sel === p.id ? 'on' : ''}" draggable="true" data-act="sel" data-id="${esc(p.id)}">
            <span class="nm">${esc(p.name)}</span>
            <button class="cbtn ${p.captain ? 'on' : ''}" data-act="cap" data-id="${esc(p.id)}" title="Capitán">C</button></div>`).join('')
          || `<div class="empty">${d.pool.length ? 'Sin resultados.' : (placed ? '¡Todos los jugadores ya tienen equipo!' : 'No hay jugadores. Cárgalos en Administración → Jugadores y sorteo.')}</div>`}</div>
      </div>
      <div class="dteams">${teams.map(t => `<div class="dt ${sel ? 'ready' : ''}" data-act="assign" data-team="${esc(t.id)}">
          <div class="dt-h">${UI.badge(t)}<h3>${esc(t.name)}</h3><small>${stat(t)}</small></div>
          ${t.players.map(p => `<div class="dr" draggable="true" data-pid="${esc(p.id)}"><span class="n">${p.num}</span><span class="nm">${esc(p.name)}</span>
            <button class="cbtn ${p.captain ? 'on' : ''}" data-act="cap" data-id="${esc(p.id)}" title="Capitán">C</button>
            <button class="x" data-act="back" data-id="${esc(p.id)}" title="Devolver a la lista">✕</button></div>`).join('') || '<div class="muted" style="font-size:13px">Sin jugadores</div>'}
        </div>`).join('')}</div>
    </div>`}`;
  if (active) { const i = document.getElementById('q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  if (activeFrom) { const i = document.getElementById('from-q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
}

const m = fn => T.mutate(s => fn(s));

app.addEventListener('input', e => { if (e.target.id === 'q') { query = e.target.value; render(); } else if (e.target.id === 'from-q') { fromQ = e.target.value; render(); } });

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case 'cat': cat = id; sel = null; try { localStorage.setItem('torneo.cat', id); } catch (er) { /* ignore */ } render(); break;
    case 'sel': sel = sel === id ? null : id; render(); break;
    case 'cap': e.stopPropagation(); e.preventDefault(); m(s => {
      const dd = T.draftW(s, cat);
      const p = dd.pool.find(x => x.id === id) || s.teams.flatMap(t => t.players).find(x => x.id === id);
      if (p) p.captain = !p.captain;
    }); break;
    case 'back': e.stopPropagation(); m(s => T.draftReturn(s, cat, id)); break;
    case 'assign':
      if (!sel) return UI.toast('Primero toca un jugador de la lista', 'bad');
      { const pid = sel; sel = null; let ok = true; m(s => { ok = T.draftAssign(s, cat, pid, b.dataset.team); }); if (!ok) UI.toast('No se pudo mover (un capitán no cambia de equipo: devuélvelo con ✕)', 'bad'); } break;
    case 'capsel': e.stopPropagation(); e.preventDefault(); if (capSel.has(id)) capSel.delete(id); else capSel.add(id); render(); break;
    case 'fromtoggle': fromOpen = !fromOpen; render(); break;
    case 'addfrom': e.preventDefault(); { const nm = b.dataset.name; m(s => { T.addParents(s, cat, [nm]); }); } break;
    case 'parsel': e.stopPropagation(); e.preventDefault(); if (parSel.has(id)) parSel.delete(id); else parSel.add(id); render(); break;
    case 'delparent': e.stopPropagation(); e.preventDefault(); m(s => { const dd = T.draftW(s, cat); dd.parents = (dd.parents || []).filter(p => p.id !== id); }); break;
    case 'addparents': {
      const names = document.getElementById('par-text').value.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
      if (!names.length) return UI.toast('Pega al menos un nombre', 'bad');
      let n = 0; m(s => { n = T.addParents(s, cat, names); });
      UI.toast(`${n} agregados` + (names.length - n ? `, ${names.length - n} repetidos omitidos` : '')); break;
    }
    case 'drawparents': {
      const all = !parSel.size, ids = all ? (T.draft(T.state(), cat).parents || []).map(p => p.id) : [...parSel];
      if (all && ids.length > 1 && !confirm(`No elegiste a nadie en particular: se sortea UN equipo para los ${ids.length} de la lista, juntos. ¿Continuar?`)) return;
      let r;
      m(s => { r = T.draftParentGroup(s, cat, ids); });
      parSel.clear();
      if (r !== 'ok') UI.toast({ none: 'Elige al menos un nombre', noteam: 'No hay equipos en esta categoría' }[r], 'bad');
      render(); break;
    }
    case 'drawcapgroup': {
      let r; const ids = [...capSel];
      m(s => { r = T.draftCaptainGroup(s, cat, ids, document.getElementById('cap-coach').checked); });
      capSel.clear();
      if (r !== 'ok') UI.toast({ none: 'Elige al menos un capitán', noteam: 'Ya no hay equipos sin capitanes' }[r], 'bad');
      render(); break;
    }
    case 'resetplayers':
      if (confirm('¿Devolver a la lista a todos los jugadores de esta categoría? Los capitanes se quedan en su equipo.')) { m(s => T.draftReset(s, cat, false)); UI.toast('Sorteo de jugadores reiniciado'); }
      break;
    case 'resetall':
      if (confirm('¿Reiniciar TODO el sorteo de esta categoría? Todos los jugadores, capitanes incluidos, vuelven a la lista (los capitanes siguen marcados con la C).')) { m(s => T.draftReset(s, cat, true)); UI.toast('Sorteo reiniciado'); }
      break;
    case 'drawcap': {
      const tid = document.getElementById('cap-team').value;
      let r;
      m(s => { r = T.draftCaptain(s, cat, tid); });
      capTeam = null;
      if (r === 'short') UI.toast('Había menos capitanes marcados de los necesarios: faltan por asignar', 'bad'); else if (r !== 'ok') UI.toast({ has: 'Ese equipo ya tiene todos sus capitanes', none: 'No hay capitanes marcados sin equipo', noteam: 'Equipo no válido' }[r], 'bad');
      render(); break;
    }
    case 'drawteam': {
      const tid = document.getElementById('draw-team').value;
      if (T.isTeamDone(T.draft(T.state(), cat), T.state().teams.find(t => t.id === tid)) && !confirm('Este equipo ya fue sorteado. ¿Agregarle más jugadores?')) return;
      let got = 0;
      m(s => { got = T.draftGroup(s, cat, tid); });
      drawTeam = null;
      UI.toast(got ? `Equipo formado con ${got} jugadores` : 'No hay jugadores disponibles para sortear', got ? '' : 'bad');
      render(); break;
    }
    case 'undo': m(s => T.draftUndo(s, cat)); break;
  }
});

app.addEventListener('change', e => {
  if (e.target.id === 'draw-team') { drawTeam = e.target.value; render(); }
  else if (e.target.id === 'cap-coach') capCoach = e.target.checked;
  else if (e.target.id === 'cap-team') { capTeam = e.target.value; render(); }
});

/* Arrastrar y soltar (escritorio) */
app.addEventListener('dragstart', e => {
  const el = e.target.closest('[data-id].dp, .dr[data-pid]');
  if (!el) return;
  e.dataTransfer.setData('text/plain', el.dataset.id || el.dataset.pid);
  e.dataTransfer.effectAllowed = 'move';
});
app.addEventListener('dragover', e => { const t = e.target.closest('.dt'); if (t) { e.preventDefault(); t.classList.add('over'); } });
app.addEventListener('dragleave', e => { const t = e.target.closest('.dt'); if (t) t.classList.remove('over'); });
app.addEventListener('drop', e => {
  const t = e.target.closest('.dt');
  if (!t) return;
  e.preventDefault();
  const pid = e.dataTransfer.getData('text/plain');
  if (pid) { sel = null; m(s => T.draftAssign(s, cat, pid, t.dataset.team)); }
});

UI.gate(app, start);
});
</script>
</body>
</html>
